version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: keycloak
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d
    networks:
      - aether-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    container_name: keycloak
    depends_on:
      - postgres
    command: 
      - start-dev 
      - --import-realm
    ports:
      - "8080:8080"
    restart: always
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      # Admin
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      KC_HTTP_RELATIVE_PATH: /keycloak
      KC_HOSTNAME: 46.243.55.90  # Statt ${PROD_DOMAIN:-xn--ther-uoa.tech}
      KC_PROXY: edge
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/exports:/opt/keycloak/data/import
    networks:
      - aether-network

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-aetherintel}/aether-backend:latest
    container_name: backend
    restart: on-failure
    user: "root"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/aether

      # SWAGGER_TOKEN_URL: https://${PROD_DOMAIN:-xn--ther-uoa.tech}/keycloak/realms/Aether/protocol/openid-connect/token
      # KEYCLOAK_BASE_URL: https://${PROD_DOMAIN:-xn--ther-uoa.tech}/keycloak
      # KEYCLOAK_URL: https://${PROD_DOMAIN:-xn--ther-uoa.tech}/keycloak/realms/Aether
      # KEYCLOAK_INTERNAL_URL: https://${PROD_DOMAIN:-xn--ther-uoa.tech}/keycloak/realms/Aether

      SWAGGER_TOKEN_URL: http://keycloak:8080/realms/Aether/protocol/openid-connect/token
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_URL: http://keycloak:8080/realms/Aether
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/Aether
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_HOSTNAME: keycloak
      KEYCLOAK_ADMIN_CLIENT_ID: backend-admin-client
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      KEYCLOAK_CLIENT_ID: Aether
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      FRONTEND_URL: https://${PROD_DOMAIN:-xn--ther-uoa.tech}/
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: telegramdb
      POSTGRES_USER: telegramuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NEO4J_USER: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      JOB_LAUNCHER_URL: http://job-launcher:9001
      JOB_SECRET_TOKEN: ${JOB_SECRET_TOKEN}
      TG_API_ID: ${TG_API_ID}
      TG_API_HASH: ${TG_API_HASH}
      TG_PHONE: ${TG_PHONE}
      MEDIA_PATH: ${PWD}/shared/media
      ENVIRONMENT: prod

      GITHUB_USER: ${GITHUB_USER}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - tg_sessions:/app/sessions
      - ${PWD}/shared/media:/shared/media
    depends_on:
      - postgres
      - keycloak
    ports:
      - "8000:8000"
    networks:
      - aether-network

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-aetherintel}/aether-frontend:latest
    container_name: frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      PROD_DOMAIN: ${PROD_DOMAIN}
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./shared/media:/usr/share/nginx/html/app/public/media:ro
    restart: always
    depends_on:
      - backend
    networks:
      - aether-network

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'sleep 10 && certbot certonly --webroot -w /var/www/certbot -d ${PROD_DOMAIN} --email ${PROD_MAIL} --agree-tos --non-interactive'"
    networks:
      - aether-network

  neo4j:
    image: neo4j:5.18
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP browser (optional)
      - "7687:7687"   # Bolt (for drivers like your scraper)
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      retries: 10
    networks:
      - aether-network
    
  telegram-job:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-aetherintel}/aether-telegram-scraper:latest
    container_name: telegram_scraper
    environment:
      ENVIRONMENT: prod
      TG_API_ID: ${TG_API_ID}
      TG_API_HASH: ${TG_API_HASH}
      TG_PHONE: ${TG_PHONE}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: telegramdb
      POSTGRES_USER: telegramuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      MEDIA_PATH: /shared/media
    volumes:
      - tg_sessions:/app/sessions
      - ./shared/media:/shared/media
    networks:
      - aether-network

  job-launcher:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-aetherintel}/aether-job-launcher:latest
    container_name: job_launcher
    ports:
      - "9001:9001"
    environment:
      JOB_SECRET_TOKEN: ${JOB_SECRET_TOKEN}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      TG_API_ID: ${TG_API_ID}
      TG_API_HASH: ${TG_API_HASH}
      MEDIA_PATH: ${PWD}/shared/media
      ENVIRONMENT: prod
      GITHUB_USER: ${GITHUB_USER}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_REPOSITORY_OWNER: ${GITHUB_REPOSITORY_OWNER}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - tg_sessions:/app/sessions
      - ./shared/media:/shared/media
    networks:
      - aether-network

networks:
  aether-network:
    driver: bridge

volumes:
  pgdata:
  neo4j_data:
  neo4j_logs:
  keycloak_data:
  tg_sessions: