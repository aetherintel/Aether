services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: keycloak
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    container_name: keycloak
    depends_on:
      - postgres
    command: start-dev --import-realm --hostname https://htit-monitor.marvin-carstensen.com/keycloak --hostname-admin https://htit-monitor.marvin-carstensen.com/keycloak/admin --proxy-headers xforwarded

    ports:
      - "8080:8080"
    restart: always
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      PROXY_ADDRESS_FORWARDING: true
    volumes:
      - ./keycloak/exports:/opt/keycloak/data/export
      
  backend:
    image: ${DOCKER_USERNAME}/monitor-backend:latest
    container_name: backend
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_URL: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/myproject
      SWAGGER_TOKEN_URL: http://keycloak:8080/realms/HotTopics/protocol/openid-connect/token
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_HOSTNAME: keycloak
      KEYCLOAK_ADMIN_CLIENT_ID: backend-admin-client
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      KEYCLOAK_CLIENT_ID: HotTopics
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    restart: always
    depends_on:
      - postgres
      - keycloak
      
  frontend:
    image: ${DOCKER_USERNAME}/monitor-frontend:latest
    container_name: frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PROD_DOMAIN=${PROD_DOMAIN}
    volumes:
      - ./frontend:/app
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    restart: always
    depends_on: 
      - backend

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'sleep 10 && certbot certonly --webroot -w /var/www/certbot -d ${PROD_DOMAIN} --email ${PROD_MAIL} --agree-tos --non-interactive'"

volumes:
  pgdata:
