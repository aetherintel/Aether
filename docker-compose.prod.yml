services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d
    networks:
      - aether-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    container_name: keycloak
    depends_on:
      - postgres
    command: 
      - start-dev 
      - --import-realm
    ports:
      - "127.0.0.1:8080:8080"
    restart: always
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_RELATIVE_PATH: /keycloak
      KC_HOSTNAME: ${PROD_DOMAIN:-aethery.cloud}
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_SPI_LOGIN_PROTOCOL_OPENID_CONNECT_LEGACY_LOGOUT_REDIRECT_URI: true
      KC_PROXY: edge
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/exports:/opt/keycloak/data/import
    networks:
      - aether-network

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-aetherintel}/aether-backend:latest
    container_name: backend
    restart: on-failure
    user: "root"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/aether
      SWAGGER_TOKEN_URL: https://${PROD_DOMAIN:-aethery.cloud}/keycloak/realms/Aether/protocol/openid-connect/token
      KEYCLOAK_BASE_URL: http://keycloak:8080/keycloak
      KEYCLOAK_URL: https://${PROD_DOMAIN:-aethery.cloud}/keycloak/realms/Aether
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/keycloak/realms/Aether
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_HOSTNAME: keycloak
      KEYCLOAK_ADMIN_CLIENT_ID: backend-admin-client
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      KEYCLOAK_CLIENT_ID: Aether
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      FRONTEND_URL: https://${PROD_DOMAIN:-aethery.cloud}/
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: telegramdb
      POSTGRES_USER: telegramuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NEO4J_USER: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      
      TG_API_ID: ${TG_API_ID}
      TG_API_HASH: ${TG_API_HASH}
      TG_PHONE: ${TG_PHONE}
      MEDIA_PATH: /shared/media
      ENVIRONMENT: prod
      GITHUB_USER: ${GITHUB_USER}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - tg_sessions:/app/sessions
      - ./shared/media:/shared/media
    depends_on:
      - postgres
      - keycloak
      - neo4j
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - aether-network

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-aetherintel}/aether-frontend:latest
    container_name: frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      PROD_DOMAIN: ${PROD_DOMAIN}
    volumes:
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./shared/media:/usr/share/nginx/html/app/public/media:ro
    restart: always
    depends_on:
      - backend
    networks:
      - aether-network

  certbot-daemon:
    image: certbot/certbot:latest
    container_name: certbot-daemon
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'
    stop_signal: SIGTERM
    stop_grace_period: 30s
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    profiles: ["manual"]

  neo4j:
    image: neo4j:5.18
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      retries: 10
    networks:
      - aether-network

  # ============================================================================
  # REDIS (Central Message Queue)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - aether-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # TELEGRAM SCRAPER WORKER
  # ============================================================================
  telegram-worker:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-aetherintel}/aether-telegram-scraper:latest
    command: >
      rq worker telegram-jobs
      --url redis://redis:6379
      --worker-ttl 0
      --job-monitoring-interval 60
    restart: unless-stopped
    environment:
      ENVIRONMENT: prod
      TG_API_ID: ${TG_API_ID}
      TG_API_HASH: ${TG_API_HASH}
      TG_PHONE: ${TG_PHONE}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: telegramdb
      POSTGRES_USER: telegramuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      
      MEDIA_ROOT: /shared/media
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - tg_sessions:/app/sessions
      - ./shared/media:/shared/media
    depends_on:
      - redis
      - postgres
      - neo4j
    networks:
      - aether-network
    deploy:
      replicas: 2

  # ============================================================================
  # TRANSLATION WORKER
  # ============================================================================
  translation-worker:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-aetherintel}/aether-translation-worker:latest
    command: >
      rq worker translation-jobs
      --url redis://redis:6379/1
      --worker-ttl 1800
      --job-monitoring-interval 30
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MODELS_PATH: /app/models
      USE_QUANTIZATION: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - translation_models:/app/models
    depends_on:
      - redis
      - postgres
      - neo4j
      - backend
    networks:
      - aether-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # ============================================================================
  # IMAGE ANALYSIS WORKER
  # ============================================================================
  image-worker:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-aetherintel}/aether-image-worker:latest
    command: >
      rq worker image-jobs
      --url redis://redis:6379/2
      --worker-ttl 1800
      --job-monitoring-interval 30
    restart: unless-stopped
    environment:
      HOME: /app/models
      PADDLEX_HOME: /app/models
      MODEL_BASE_DIR: /app/models
      
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    volumes:
      - ./shared/media:/shared/media:ro
      - image_models:/app/models
    depends_on:
      - redis
      - neo4j
      - backend
    networks:
      - aether-network
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  # ============================================================================
  # AUDIO TRANSCRIPTION WORKER (Whisper)
  # ============================================================================
  audio-worker:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-aetherintel}/aether-audio-worker:latest
    command: >
      rq worker audio-jobs
      --url redis://redis:6379/3
      --worker-ttl 3600
      --job-monitoring-interval 60
    restart: unless-stopped
    environment:
      
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      MODELS_PATH: /app/models
      USE_QUANTIZATION: "true"
    volumes:
      - audio_models:/app/models
      - ./shared/media:/shared/media:ro
    depends_on:
      - redis
      - neo4j
      - backend
    networks:
      - aether-network
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 1G

  # ============================================================================
  # EMOTION ANALYSIS WORKER
  # ============================================================================
  emotion-worker:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-aetherintel}/aether-emotion-worker:latest
    command: >
      rq worker emotion-jobs
      --url redis://redis:6379/4
      --worker-ttl 900
      --job-monitoring-interval 30
    restart: unless-stopped
    environment:

      
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      MODELS_PATH: /app/models
      USE_QUANTIZATION: "true"
    volumes:
      - emotion_models:/app/models
    depends_on:
      - redis
      - neo4j
      - backend
    networks:
      - aether-network
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  # ============================================================================
  # CLASSIFICATION WORKER
  # ============================================================================
  classification-worker:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-aetherintel}/aether-classification-worker:latest
    command: >
      rq worker classification-jobs
      --url redis://redis:6379/5
      --worker-ttl 900
      --job-monitoring-interval 30
    restart: unless-stopped
    environment:

      
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      MODELS_PATH: /app/models
      USE_QUANTIZATION: "true"
    volumes:
      - classifier_models:/app/models
      - ./shared/media:/shared/media:ro
    depends_on:
      - redis
      - neo4j
      - postgres
      - backend
    networks:
      - aether-network
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G

  # ============================================================================
  # GEOLOCATION WORKER
  # ============================================================================
  geolocation-worker:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-aetherintel}/aether-geolocation-worker:latest
    command: >
      rq worker geolocation-jobs
      --url redis://redis:6379/6
      --worker-ttl 900
      --job-monitoring-interval 30
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      
      PHOTON_URL: http://photon:2322
    volumes:
      - geolocation_models:/app/models
    depends_on:
      - redis
      - neo4j
      - photon
      - backend
    networks:
      - aether-network
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ============================================================================
  # PHOTON GEOCODING SERVICE
  # ============================================================================
  photon:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-aetherintel}/aether-photon:latest
    container_name: photon
    restart: unless-stopped
    ports:
      - "127.0.0.1:2322:2322"
    volumes:
      - photon_data:/photon/photon_data
    environment:
      - JAVA_OPTS=-Xmx2g
    networks:
      - aether-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2322/api?q=Berlin"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
networks:
  aether-network:
    driver: bridge

volumes:
  pgdata:
  neo4j_data:
  neo4j_logs:
  keycloak_data:
  tg_sessions:
  redis_data:
  ai_models:
  translation_models:
    external: true
    name: app_translation_models  # ← Expliziter Name
  audio_models:
    external: true
    name: app_audio_models
  emotion_models:
    external: true
    name: app_emotion_models
  classifier_models:
    external: true
    name: app_classifier_models
  image_models:
    external: true
    name: app_image_models
  geolocation_models:
    external: true
    name: app_geolocation_models
  photon_data:
    external: true
    name: app_photon_data