services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d
    networks:
      - aether-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    container_name: keycloak
    depends_on:
      - postgres
    command: 
      - start
      - --import-realm
    ports:
      - "127.0.0.1:8082:8080"
    restart: always
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_RELATIVE_PATH: /keycloak
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_SPI_LOGIN_PROTOCOL_OPENID_CONNECT_LEGACY_LOGOUT_REDIRECT_URI: "true"
      KC_HOSTNAME_URL: https://${PROD_DOMAIN:-aethery.cloud}/keycloak
      KC_HOSTNAME_ADMIN_URL: https://${PROD_DOMAIN:-aethery.cloud}/keycloak 
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/exports:/opt/keycloak/data/import
    networks:
      - aether-network

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-aetherintel}/aether-backend:latest
    container_name: backend
    restart: on-failure
    user: "root"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/aether
      SWAGGER_TOKEN_URL: https://${PROD_DOMAIN:-aethery.cloud}/keycloak/realms/Aether/protocol/openid-connect/token
      KEYCLOAK_BASE_URL: http://keycloak:8080/keycloak
      KEYCLOAK_URL: https://${PROD_DOMAIN:-aethery.cloud}/keycloak/realms/Aether
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/keycloak/realms/Aether
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_HOSTNAME: keycloak
      KEYCLOAK_ADMIN_CLIENT_ID: backend-admin-client
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      KEYCLOAK_CLIENT_ID: Aether
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      FRONTEND_URL: https://${PROD_DOMAIN:-aethery.cloud}/
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: telegramdb
      POSTGRES_USER: telegramuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NEO4J_USER: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      
      TG_API_ID: ${TG_API_ID}
      TG_API_HASH: ${TG_API_HASH}
      TG_PHONE: ${TG_PHONE}
      MEDIA_PATH: /shared/media
      ENVIRONMENT: prod
      GITHUB_USER: ${GITHUB_USER}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      LLM_SERVICE_URL: ${MODAL_LLM_URL}
      MODAL_LLM_URL: ${MODAL_LLM_URL}
      USE_MODAL: ${USE_MODAL:-true}
      MODAL_TOKEN_ID: ${MODAL_TOKEN_ID}
      MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET}
      MODAL_TRANSLATION_URL: ${MODAL_TRANSLATION_URL}
      MODAL_EMOTION_URL: ${MODAL_EMOTION_URL}
      MODAL_CLASSIFICATION_URL: ${MODAL_CLASSIFICATION_URL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - tg_sessions:/app/sessions
      - ./shared/media:/shared/media
    depends_on:
      - postgres
      - keycloak
      - neo4j
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - aether-network

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-aetherintel}/aether-frontend:latest
    container_name: frontend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      PROD_DOMAIN: ${PROD_DOMAIN}
    volumes:
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./shared/media:/usr/share/nginx/html/app/public/media:ro
    restart: always
    depends_on:
      - backend
    networks:
      - aether-network

  certbot-daemon:
    image: certbot/certbot:latest
    container_name: certbot-daemon
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'
    stop_signal: SIGTERM
    stop_grace_period: 30s
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    profiles: ["manual"]

  neo4j:
    image: neo4j:5.18
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      retries: 10
    networks:
      - aether-network

  mcp-neo4j-cypher-server:
    image: mcp/neo4j-cypher:latest
    container_name: mcp-server
    ports:
      - '9090:8000'
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_DATABASE=neo4j
      - NEO4J_TRANSPORT=sse
      - NEO4J_MCP_SERVER_HOST=0.0.0.0
      - NEO4J_MCP_SERVER_PORT=8000
      - NEO4J_MCP_SERVER_PATH=/api/mcp/
      - NEO4J_NAMESPACE=local
    depends_on:
      - neo4j
    networks:
      - aether-network
    restart: unless-stopped

  # ============================================================================
  # REDIS (Central Message Queue)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - aether-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # TELEGRAM SCRAPER WORKER
  # ============================================================================
  telegram-worker:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-aetherintel}/aether-telegram-scraper:latest
    command: >
      rq worker telegram-jobs
      --url redis://redis:6379
      --worker-ttl 0
      --job-monitoring-interval 60
    restart: unless-stopped
    environment:
      ENVIRONMENT: prod
      TG_API_ID: ${TG_API_ID}
      TG_API_HASH: ${TG_API_HASH}
      TG_PHONE: ${TG_PHONE}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: telegramdb
      POSTGRES_USER: telegramuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      
      MEDIA_ROOT: /shared/media
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - tg_sessions:/app/sessions
      - ./shared/media:/shared/media
    depends_on:
      - redis
      - postgres
      - neo4j
    networks:
      - aether-network
    deploy:
      replicas: 2

  # ============================================================================
  # REPORT WORKER
  # ============================================================================
  report-worker:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-aetherintel}/aether-report-worker:latest
    command: >
      rq worker report-jobs
      --url redis://redis:6379
      --worker-ttl 900
      --job-monitoring-interval 30
    restart: unless-stopped
    environment:
      DB_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/aether
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      PYTHONPATH: /app:/app/app
    volumes:
      - ./shared/media:/shared/media:ro
      - ./shared/reports:/shared/reports
    depends_on:
      - redis
      - postgres
      - neo4j
    networks:
      - aether-network
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ============================================================================
  # IMAGE ANALYSIS WORKER
  # ============================================================================
  image-worker:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-aetherintel}/aether-image-worker:latest
    command: >
      rq worker image-jobs
      --url redis://redis:6379/2
      --worker-ttl 1800
      --job-monitoring-interval 30
    restart: unless-stopped
    environment:
      HOME: /app/models
      PADDLEX_HOME: /app/models
      MODEL_BASE_DIR: /app/models
      
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    volumes:
      - ./shared/media:/shared/media:ro
      - app_image_models:/app/models
    depends_on:
      - redis
      - neo4j
      - backend
      - image-models
    networks:
      - aether-network
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  # ============================================================================
  # AUDIO TRANSCRIPTION WORKER (Whisper)
  # ============================================================================
  audio-worker:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-aetherintel}/aether-audio-worker:latest
    command: >
      rq worker audio-jobs
      --url redis://redis:6379/3
      --worker-ttl 3600
      --job-monitoring-interval 60
    restart: unless-stopped
    environment:
      
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      MODELS_PATH: /app/models
      USE_QUANTIZATION: "true"
    volumes:
      - app_audio_models:/app/models
      - ./shared/media:/shared/media:ro
    depends_on:
      - redis
      - neo4j
      - backend
      - audio-models
    networks:
      - aether-network
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 1G

  # ============================================================================
  # GEOLOCATION WORKER
  # ============================================================================
  geolocation-worker:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-aetherintel}/aether-geolocation-worker:latest
    command: >
      rq worker geolocation-jobs
      --url redis://redis:6379/6
      --worker-ttl 900
      --job-monitoring-interval 30
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ESRI_API_KEY: ${ESRI_API_KEY}
    volumes:
      - app_geolocation_models:/app/models
    depends_on:
      - redis
      - neo4j
      - backend
      - geolocation-models
    networks:
      - aether-network
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ============================================================================
  # LLM SERVICE
  # ============================================================================
  llm-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-aetherintel}/aether-llm-service:latest
    container_name: aether-llm-service
    ports:
      - "8001:8001"
    volumes:
      - app_llm_models:/models/llm    # Shared models volume
    environment:
      - MODEL_PATH=/models/llm/qwen2.5-7b-instruct-q4_k_m.gguf
      - N_THREADS=6
      - N_CTX=16384
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aether-network
    depends_on:
      - llm-models
  # ============================================================================
  # MODEL CONTAINERS
  # ============================================================================
  
  audio-models:
    build:
      context: ./models
      dockerfile: audio/Dockerfile
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-aetherintel}/aether-audio-models:latest
    volumes:
      - app_audio_models:/models

  image-models:
    build:
      context: ./models
      dockerfile: image/Dockerfile
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-aetherintel}/aether-image-models:latest
    volumes:
      - app_image_models:/models

  geolocation-models:
    build:
      context: ./models
      dockerfile: geolocation/Dockerfile
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-aetherintel}/aether-geolocation-models:latest
    volumes:
      - app_geolocation_models:/models

  llm-models:
    build:
      context: ./models
      dockerfile: llm/Dockerfile
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-aetherintel}/aether-llm-models:latest
    volumes:
      - app_llm_models:/models/llm

networks:
  aether-network:
    driver: bridge

volumes:
  pgdata:
  neo4j_data:
  neo4j_logs:
  keycloak_data:
  tg_sessions:
  redis_data:
  app_audio_models:
  app_image_models:
    name: app_image_models
  app_geolocation_models:
  app_llm_models: