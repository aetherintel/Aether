services:
  backend:
    image: ${DOCKER_USERNAME}/monitor-backend:latest
    container_name: frontend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    restart: always

  frontend:
    image: ${DOCKER_USERNAME}/monitor-frontend:latest
    container_name: frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/app
    restart: always
    depends_on: 
      - backend
