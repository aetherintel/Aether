      # KC_HOSTNAME_STRICT_HTTPS: "false"
      # KC_HTTP_ENABLED: "true"
      
    # volumes:
    #   - keycloak_data:/opt/keycloak/data
    #   - ./keycloak/exports:/opt/keycloak/data/import
  backend:
    build: ./backend/app
    restart: on-failure
    env_file:
      - .env.dev
    environment:
      DB_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/aether
      # KEYCLOAK_URL: http://${KEYCLOAK_HOSTNAME}:8080/realms/Aether
      #SWAGGER_TOKEN_URL: http://localhost:8080/realms/Aether/protocol/openid-connect/token
      ENVIRONMENT: ${ENVIRONMENT}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - tg_sessions:/app/sessions
      - ${MEDIA_PATH}:/shared/media
    depends_on:
      - postgres
      # - keycloak
    ports:
      - "8000:8000"
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/app
      - ./frontend/nginx-dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./shared/media:/usr/share/nginx/html/app/public/media
    restart: always
    depends_on:
      - backend
  neo4j:
    image: neo4j:5.18
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP browser (optional)
      - "7687:7687"   # Bolt (for drivers like your scraper)
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER}", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      retries: 10
    
  telegram-job:
    build:
      context: ./telegram_scraper
    image: telegram-job:latest
    #entrypoint: ["sleep", "infinity"]  # Keeps image warm but does nothing unless called
    volumes:
      - tg_sessions:/app/sessions    # ⬅️ Session volume (Telegram auth)
      - ./shared/media:/shared/media
    # profiles: ["scraper"] 
  job-launcher:
    build: ./job_launcher
    ports:
      - "9001:9001"
    env_file:
      - .env.dev
    environment:
      JOB_SECRET_TOKEN: ${JOB_SECRET_TOKEN}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      TG_API_ID: ${TG_API_ID}
      TG_API_HASH: ${TG_API_HASH}
      MEDIA_PATH: ${MEDIA_PATH}
      ENVIRONMENT: ${ENVIRONMENT}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - tg_sessions:/app/sessions
volumes:
  pgdata:
  neo4j_data:
  neo4j_logs:
  # keycloak_data:
  tg_sessions: