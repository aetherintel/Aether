services:
  postgres:
    image: pgvector/pgvector:pg15  # ← Geändert von postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d
      - ./docker/db-init/02-init-pgvector.sql:/docker-entrypoint-initdb.d/02-init-pgvector.sql
    ports:
      - "5432:5432"  # Falls noch nicht exposed
  # keycloak:
