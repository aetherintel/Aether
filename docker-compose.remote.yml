# =============================================================================
# docker-compose.remote.yml
# =============================================================================
# GPU Worker Stack for vast.ai instances.
# All workers use network_mode: host to access SSH-tunneled local services
# (Redis, Postgres, Neo4j) on localhost.
#
# Usage:
#   docker compose -f docker-compose.remote.yml --env-file .env.remote up -d
# =============================================================================

services:

  # ============================================================================
  # MODEL DATA CONTAINERS (one-shot, populate volumes then exit)
  # ============================================================================

  llm-models:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-aetherintel}/aether-llm-models:latest
    build:
      context: ./models
      dockerfile: llm/Dockerfile
    volumes:
      - app_llm_models:/models/llm_vol

  translation-models:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-aetherintel}/aether-translation-models:latest
    build:
      context: ./models
      dockerfile: translation/Dockerfile
    volumes:
      - app_translation_models:/models

  emotion-models:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-aetherintel}/aether-emotion-models:latest
    build:
      context: ./models
      dockerfile: emotion/Dockerfile
    volumes:
      - app_emotion_models:/models



  # ============================================================================
  # LLM SERVICE (GPU)
  # ============================================================================

  llm-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-aetherintel}/aether-llm-service:latest
    build: ./workers/llm-service
    container_name: aether-llm-service
    network_mode: host
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - MODEL_PATH=/models/llm/llm/codestral-22b-v0.1-q4_k_m.gguf
      - N_THREADS=${N_THREADS:-6}
      - N_CTX=${N_CTX:-16384}
    volumes:
      - app_llm_models:/models/llm
    depends_on:
      llm-models:
        condition: service_completed_successfully

  # ============================================================================
  # TRANSLATION WORKER (GPU)
  # ============================================================================

  translation-worker:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-aetherintel}/aether-translation-worker:latest
    build:
      context: .
      dockerfile: workers/translation_worker/Dockerfile
    network_mode: host
    restart: unless-stopped
    command: >
      rq worker translation-jobs
      --url redis://localhost:6379/1
      --worker-ttl 1800
      --job-monitoring-interval 30
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - REDIS_HOST=localhost
      - REDIS_PORT=6379
      - MODELS_PATH=/app/models
      - USE_QUANTIZATION=true
      - NEO4J_URI=bolt://localhost:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@localhost:5432/${POSTGRES_DB}
    volumes:
      - app_translation_models:/app/models
    depends_on:
      translation-models:
        condition: service_started

  # ============================================================================
  # IMAGE ANALYSIS WORKER (GPU)
  # ============================================================================





  # ============================================================================
  # EMOTION ANALYSIS WORKER (GPU)
  # ============================================================================

  emotion-worker:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-aetherintel}/aether-emotion-worker:latest
    build:
      context: .
      dockerfile: workers/emotion_worker/Dockerfile
    network_mode: host
    restart: unless-stopped
    command: >
      rq worker emotion-jobs
      --url redis://localhost:6379/4
      --worker-ttl 900
      --job-monitoring-interval 30
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - NEO4J_URI=bolt://localhost:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - MODELS_PATH=/app/models
      - USE_QUANTIZATION=true
    volumes:
      - app_emotion_models:/app/models
    depends_on:
      emotion-models:
        condition: service_started

volumes:
  app_llm_models:
  app_translation_models:
  app_audio_models:
  app_emotion_models: