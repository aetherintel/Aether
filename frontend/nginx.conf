server {
    listen 80;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://${PROD_DOMAIN}$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name htit-monitor.marvin-carstensen.com

    ssl_certificate /etc/letsencrypt/live/htit-monitor.marvin-carstensen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/htit-monitor.marvin-carstensen.com/privkey.pem;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:5000/;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 3600;
    }
}