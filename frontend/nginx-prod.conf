server {
    listen 80;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://htit-monitor.marvin-carstensen.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name htit-monitor.marvin-carstensen.com;

    ssl_certificate /etc/letsencrypt/live/htit-monitor.marvin-carstensen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/htit-monitor.marvin-carstensen.com/privkey.pem;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 3600;
    }

    location /keycloak/ {
        proxy_pass http://keycloak:8080/keycloak/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
    }

    location /neo4j/ {
        proxy_pass http://neo4j:7474/browser/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        rewrite ^/neo4j(/.*)$ $1 break;
    }

    location /bolt/ {
        proxy_pass http://neo4j:7687/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
