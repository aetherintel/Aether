# nginx.prod.conf

server {
    listen 80;
    server_name aethery.cloud;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://aethery.cloud$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name aethery.cloud;
    
    ssl_certificate /etc/letsencrypt/live/aethery.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aethery.cloud/privkey.pem;
    
    # Media files - WICHTIG für Bilder/Videos
    location /shared/media/ {
        alias /usr/share/nginx/html/app/public/media/;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000";
        add_header Access-Control-Allow-Origin *;
    }
    
    # Frontend
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
    
    # Backend API
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
    }
    
    # Keycloak
    location /keycloak/ {
        proxy_pass http://keycloak:8080/keycloak/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
    
    # Optional: Neo4j Browser (nur wenn du das brauchst)
    # location /browser/ {
    #     proxy_pass http://neo4j:7474/;
    #     proxy_set_header Host $host;
    # }
}