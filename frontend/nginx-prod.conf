server {
    listen 80;
    server_name aethery.cloud;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location /browser/ {
        proxy_pass http://neo4j:7474/;
    }
    
    location / {
        return 301 https://aethery.cloud$request_uri;  # Ändere zu aethery.cloud
    }
}

server {
    listen 443 ssl http2;
    server_name aethery.cloud;

    ssl_certificate /etc/letsencrypt/live/aethery.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aethery.cloud/privkey.pem;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 3600;
    }

    location /keycloak/ {
        proxy_pass http://keycloak:8080/keycloak/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
    }
}
