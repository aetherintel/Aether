# nginx.prod.conf
server {
    listen 80 default_server;
    server_name aethery.cloud _;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name aethery.cloud _;
    
    ssl_certificate /etc/letsencrypt/live/aethery.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aethery.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    
    # Media files
    location /shared/media/ {
        alias /usr/share/nginx/html/app/public/media/;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000";
        add_header Access-Control-Allow-Origin *;
    }
    
    # Frontend
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
    
    # Backend API
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600;
    }
    
    # Keycloak - Admin blockieren (höchste Priorität)
    location ~ ^/keycloak/(admin|welcome) {
        deny all;
        return 403;
    }
    
    # Keycloak - Alle anderen Endpoints erlauben
    location /keycloak/ {
        proxy_pass http://keycloak:8080/keycloak/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}