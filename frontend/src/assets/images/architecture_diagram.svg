  <text x="340" y="71" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">Nginx</text>
  <text x="340" y="87" text-anchor="middle" font-size="12" fill="#5F5E5A">Reverse proxy + TLS</text>

  <rect x="500" y="52" width="148" height="44" rx="8" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
