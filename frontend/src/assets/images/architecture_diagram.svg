  <rect x="506" y="420" width="118" height="44" rx="8" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
  <text x="565" y="439" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Emotion</text>
  <text x="565" y="455" text-anchor="middle" font-size="12" fill="#993C1D">via Modal</text>

  <rect x="374" y="504" width="118" height="44" rx="8" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
  <text x="433" y="523" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Classification</text>
  <text x="433" y="539" text-anchor="middle" font-size="12" fill="#993C1D">via Modal</text>

  <rect x="506" y="504" width="118" height="44" rx="8" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
  <text x="565" y="523" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">LLM</text>
  <text x="565" y="539" text-anchor="middle" font-size="12" fill="#993C1D">via Modal</text>

