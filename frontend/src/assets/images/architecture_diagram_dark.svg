  <text x="565" y="455" text-anchor="middle" font-size="12" fill="#F0997B">via Modal</text>

  <rect x="374" y="504" width="118" height="44" rx="8" fill="#4A1B0C" stroke="#993C1D" stroke-width="0.5"/>
  <text x="433" y="523" text-anchor="middle" font-size="14" font-weight="500" fill="#F5C4B3">Classification</text>
  <text x="433" y="539" text-anchor="middle" font-size="12" fill="#F0997B">via Modal</text>

  <rect x="506" y="504" width="118" height="44" rx="8" fill="#4A1B0C" stroke="#993C1D" stroke-width="0.5"/>
  <text x="565" y="523" text-anchor="middle" font-size="14" font-weight="500" fill="#F5C4B3">LLM</text>
