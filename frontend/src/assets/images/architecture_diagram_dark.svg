  <text x="340" y="87" text-anchor="middle" font-size="12" fill="#888780">Reverse proxy + TLS</text>

  <rect x="500" y="52" width="148" height="44" rx="8" fill="#26215C" stroke="#3C3489" stroke-width="0.5"/>
