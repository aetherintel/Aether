services:  
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: keycloak
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d
    networks:
      - aether-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.18
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - aether-network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER}", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    container_name: keycloak
    depends_on:
      postgres:
        condition: service_healthy
    command: 
      - start-dev 
      - --import-realm
      - --hostname=localhost
      - --hostname-port=8080
      - --hostname-strict=false
      - --hostname-strict-https=false
      - --http-enabled=true
    ports:
      - "8080:8080"
    restart: always
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/exports:/opt/keycloak/data/import
    networks:
      - aether-network

  backend:
    build:
      context: .
      dockerfile: backend/app/Dockerfile
    restart: on-failure
    env_file:
      - .env.dev
    environment:
      DB_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/aether
      KEYCLOAK_URL: http://${KEYCLOAK_HOSTNAME}:8080/realms/Aether
      SWAGGER_TOKEN_URL: http://localhost:8080/realms/Aether/protocol/openid-connect/token
      ENVIRONMENT: ${ENVIRONMENT}
      PYTHONPATH: /app
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - tg_sessions:/app/sessions
      - ${MEDIA_PATH}:/shared/media
      - ./aether_lib:/app/aether_lib:ro
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - aether-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/app
      - ./frontend/nginx-dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ${MEDIA_PATH}:/usr/share/nginx/html/app/public/media
    restart: always
    depends_on:
      - backend
    networks:
      - aether-network

  redis:
    image: redis:7-alpine
    container_name: aether-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - aether-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  telegram-worker:
    build:
      context: .
      dockerfile: telegram_scraper/Dockerfile
    image: telegram-job:latest
    command: >
      rq worker telegram-jobs
      --url redis://redis:6379
      --worker-ttl 0
      --job-monitoring-interval 60
    restart: unless-stopped
    environment:
      TG_API_ID: ${TG_API_ID}
      TG_API_HASH: ${TG_API_HASH}
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MEDIA_ROOT: /shared/media
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OWNER_ID: ${OWNER_ID:-unknown}
      PYTHONPATH: /app
    volumes:
      - tg_sessions:/app/sessions
      - ${MEDIA_PATH}:/shared/media
      - ./aether_lib:/app/aether_lib:ro
    deploy:
      replicas: 2
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - aether-network

  translation-worker:
    build:
      context: .
      dockerfile: workers/translation_worker/Dockerfile
    command: >
      rq worker translation-jobs
      --url redis://redis:6379/1
      --worker-ttl 900
      --job-monitoring-interval 30
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MODELS_PATH: /app/models
      USE_QUANTIZATION: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    volumes:
      - ./aether_lib:/app/aether_lib:ro
      - app_translation_models:/app/models
      - shared_ml_libs:/app/shared_libs:ro
    depends_on:
      - redis
      - neo4j
      - postgres
      - translation-models
    networks:
      - aether-network
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  image-worker:
    build:
      context: .
      dockerfile: workers/image_worker/Dockerfile
    command: >
      rq worker image-jobs
      --url redis://redis:6379/2
      --worker-ttl 900
      --job-monitoring-interval 30
    restart: unless-stopped
    environment:
      HOME: /app/models/image
      PADDLEX_HOME: /app/models/image
      MODEL_BASE_DIR: /app/models/image
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    volumes:
      - ${MEDIA_PATH}:/shared/media:ro
      - ./aether_lib:/app/aether_lib:ro
      - app_image_models:/app/models/image
      - shared_ml_libs:/app/shared_libs:ro
    depends_on:
      - redis
      - neo4j
      - image-models
    networks:
      - aether-network
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  audio-worker:
    build:
      context: .
      dockerfile: workers/audio_worker/Dockerfile
    command: >
      rq worker audio-jobs
      --url redis://redis:6379/3
      --worker-ttl 900
      --job-monitoring-interval 30
    restart: unless-stopped
    environment:
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      MODELS_PATH: /app/models
      USE_QUANTIZATION: "true"
    volumes:
      - ./aether_lib:/app/aether_lib:ro
      - app_audio_models:/app/models/audio
      - ${MEDIA_PATH}:/shared/media:ro
      - shared_ml_libs:/app/shared_libs:ro
    depends_on:
      - redis
      - neo4j
      - audio-models
    networks:
      - aether-network
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G

  emotion-worker:
    build:
      context: .
      dockerfile: workers/emotion_worker/Dockerfile
    command: >
      rq worker emotion-jobs
      --url redis://redis:6379/4
      --worker-ttl 900
      --job-monitoring-interval 30
    restart: unless-stopped
    environment:
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      MODELS_PATH: /app/models
      USE_QUANTIZATION: "true"
    volumes:
      - ./aether_lib:/app/aether_lib:ro
      - app_emotion_models:/app/models
      - shared_ml_libs:/app/shared_libs:ro
    depends_on:
      - redis
      - neo4j
      - emotion-models
    networks:
      - aether-network
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  classification-worker:
    build:
      context: .
      dockerfile: workers/classification_worker/Dockerfile
    command: >
      rq worker classification-jobs
      --url redis://redis:6379/5
      --worker-ttl 900
      --job-monitoring-interval 30
    restart: unless-stopped
    environment:
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      MODELS_PATH: /app/models
      USE_QUANTIZATION: "true"
    volumes:
      - ./aether_lib:/app/aether_lib:ro
      - app_classifier_models:/app/models/classifier
      - ${MEDIA_PATH}:/shared/media:ro
      - shared_ml_libs:/app/shared_libs:ro
    depends_on:
      - redis
      - neo4j
      - classifier-models
    networks:
      - aether-network
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 512M

  geolocation-worker:
    build:
      context: .
      dockerfile: workers/geolocation_worker/Dockerfile
    command: >
      rq worker geolocation-jobs
      --url redis://redis:6379/6
      --worker-ttl 900
      --job-monitoring-interval 30
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JOB_SECRET_TOKEN: ${JOB_SECRET_TOKEN}
      PHOTON_URL: http://photon:2322
    volumes:
      - ./aether_lib:/app/aether_lib:ro
      - app_geolocation_models:/app/models/geolocation
      - app_photon_data:/app/photon_data
      - shared_ml_libs:/app/shared_libs:ro
    depends_on:
      - redis
      - neo4j
      - postgres
      - photon
      - geolocation-models
    networks:
      - aether-network
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  photon:
    build:
      context: .
      dockerfile: docker/photon/Dockerfile
    container_name: aether-photon
    ports:
      - "2322:2322"
    volumes:
      - ./models/geocoding/photon/photon_data:/photon/photon_data
    environment:
      JAVA_OPTS: -Xmx2g
    networks:
      - aether-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2322/api?q=Berlin"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      - postgres

  ml-libs:
    build:
      context: .
      dockerfile: docker/ml-libs/Dockerfile
    volumes:
      - shared_ml_libs:/ml-libs

  translation-models:
    build:
      context: ./models
      dockerfile: translation/Dockerfile
    volumes:
      - app_translation_models:/models

  audio-models:
    build:
      context: ./models
      dockerfile: audio/Dockerfile
    volumes:
      - app_audio_models:/models

  emotion-models:
    build:
      context: ./models
      dockerfile: emotion/Dockerfile
    volumes:
      - app_emotion_models:/models

  classifier-models:
    build:
      context: ./models
      dockerfile: classifier/Dockerfile
    volumes:
      - app_classifier_models:/models

  image-models:
    build:
      context: ./models
      dockerfile: image/Dockerfile
    volumes:
      - app_image_models:/models

  geolocation-models:
    build:
      context: ./models
      dockerfile: geolocation/Dockerfile
    volumes:
      - app_geolocation_models:/models
  
volumes:
  pgdata:
  neo4j_data:
  neo4j_logs:
  keycloak_data:
  tg_sessions:
  redis-data:
  app_translation_models:
  app_audio_models:
  app_emotion_models:
  app_classifier_models:
  app_image_models:
  app_geolocation_models:
  app_photon_data:
  shared_ml_libs:

networks:
  aether-network:
    driver: bridge