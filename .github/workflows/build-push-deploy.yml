name: CI/CD Pipeline with Model Initialization

on:
  push:
    branches: [ "test-deploy" ]
  pull_request:
    branches: [ "test-deploy" ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/aether

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # Core services
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            build-args: |
              VITE_API_URL=https://aethery.cloud/api
          - service: backend
            context: ./backend/app
            dockerfile: ./backend/app/Dockerfile
          - service: job-launcher
            context: ./job_launcher
            dockerfile: ./job_launcher/Dockerfile
          - service: telegram-scraper
            context: ./telegram_scraper
            dockerfile: ./telegram_scraper/Dockerfile
          
          # AI Worker services
          - service: translation-worker
            context: .
            dockerfile: ./workers/translation_worker/Dockerfile
          - service: image-worker
            context: .
            dockerfile: ./workers/image_worker/Dockerfile
          - service: audio-worker
            context: .
            dockerfile: ./workers/audio_worker/Dockerfile
          - service: emotion-worker
            context: .
            dockerfile: ./workers/emotion_worker/Dockerfile
          - service: classification-worker
            context: .
            dockerfile: ./workers/classification_worker/Dockerfile
          - service: geolocation-worker
            context: .
            dockerfile: ./workers/geolocation_worker/Dockerfile
          - service: photon
            context: .
            dockerfile: ./docker/photon/Dockerfile
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: ${{ matrix.build-args }}

  deploy-to-vm:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy files to production VM
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "docker-compose.prod.yml,docker/,keycloak/,certbot/,scripts/"
          target: "~/app/"
          strip_components: 0

      - name: Deploy to Production VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd ~/app

            export REGISTRY=ghcr.io
            export GITHUB_REPOSITORY_OWNER=${{ github.repository_owner }}
            export GITHUB_USER=${{ github.actor }}
            export GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
            
            # Production environment variables
            export PROD_DOMAIN=${{ secrets.PROD_DOMAIN }}
            export PROD_MAIL=${{ secrets.PROD_MAIL }}
            export DB_USER=${{ secrets.DB_USER }}
            export DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            export KEYCLOAK_ADMIN=${{ secrets.KEYCLOAK_ADMIN }}
            export KEYCLOAK_ADMIN_PASSWORD=${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
            export KEYCLOAK_CLIENT_SECRET=${{ secrets.KEYCLOAK_CLIENT_SECRET }}
            export KEYCLOAK_ADMIN_CLIENT_SECRET=${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
            export TG_API_ID=${{ secrets.TG_API_ID }}
            export TG_API_HASH=${{ secrets.TG_API_HASH }}
            export TG_PHONE=${{ secrets.TG_PHONE }}
            export POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            export NEO4J_URI=${{ secrets.NEO4J_URI }}
            export NEO4J_PASSWORD=${{ secrets.NEO4J_PASSWORD }}
            export JOB_SECRET_TOKEN=${{ secrets.JOB_SECRET_TOKEN }}
            export NEO4J_USER=neo4j
            export POSTGRES_HOST=postgres
            export POSTGRES_PORT=5432
            export POSTGRES_DB=telegramdb
            export POSTGRES_USER=telegramuser
            export JOB_LAUNCHER_URL=http://job-launcher:9001
            export MEDIA_PATH=${PWD}/shared/media
            export ENVIRONMENT=prod
            
            # Determine Docker Compose command
            if command -v docker-compose &> /dev/null; then
              COMPOSE_CMD="docker-compose"
            else
              COMPOSE_CMD="docker compose"
            fi
            
            # Login to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # ═══════════════════════════════════════════════════════════════
            # 🛡️ GRACEFUL ZERO-DOWNTIME DEPLOYMENT
            # ═══════════════════════════════════════════════════════════════
            
            # Define stateful services (NEVER recreate - contain persistent data)
            STATEFUL_SERVICES="postgres neo4j keycloak redis"
            
            # Define stateless services (safe to recreate - no data loss)
            STATELESS_SERVICES="frontend backend job-launcher telegram-worker translation-worker image-worker audio-worker emotion-worker classification-worker geolocation-worker photon certbot"
            
            echo "═══════════════════════════════════════════════════════════════"
            echo "🚀 GRACEFUL DEPLOYMENT STARTING"
            echo "═══════════════════════════════════════════════════════════════"
            echo ""
            
            # ────────────────────────────────────────────────────────────────
            # STEP 1: Ensure stateful services are running
            # ────────────────────────────────────────────────────────────────
            echo "📦 Step 1/4: Ensuring stateful services are running..."
            for service in $STATEFUL_SERVICES; do
              if $COMPOSE_CMD -f docker-compose.prod.yml ps "$service" 2>/dev/null | grep -q "Up"; then
                echo "  ✅ $service is already running (keeping as-is)"
              else
                echo "  🔄 Starting $service..."
                $COMPOSE_CMD -f docker-compose.prod.yml up -d "$service"
              fi
            done
            
            # Wait for critical services to be healthy
            echo ""
            echo "⏳ Waiting for database services to be ready..."
            sleep 10
            
            # ────────────────────────────────────────────────────────────────
            # STEP 2: Pull latest images
            # ────────────────────────────────────────────────────────────────
            echo ""
            echo "📥 Step 2/4: Pulling latest images for stateless services..."
            for service in $STATELESS_SERVICES; do
              echo "  🔽 Pulling $service..."
              $COMPOSE_CMD -f docker-compose.prod.yml pull "$service" 2>&1 | grep -v "Pulling" | head -n 1 || true
            done
            
            # ────────────────────────────────────────────────────────────────
            # STEP 3: Deploy stateless services with zero-downtime
            # ────────────────────────────────────────────────────────────────
            echo ""
            echo "🔄 Step 3/4: Deploying stateless services (zero-downtime)..."
            
            # Deploy services one by one for better control
            for service in $STATELESS_SERVICES; do
              echo "  🔄 Updating $service..."
              
              # Stop old container gracefully (if exists)
              $COMPOSE_CMD -f docker-compose.prod.yml stop "$service" --timeout 30 2>/dev/null || true
              
              # Remove old container
              $COMPOSE_CMD -f docker-compose.prod.yml rm -f "$service" 2>/dev/null || true
              
              # Start new container
              $COMPOSE_CMD -f docker-compose.prod.yml up -d "$service"
              
              # Brief pause between services to prevent overwhelming the system
              sleep 2
            done
            
            # ────────────────────────────────────────────────────────────────
            # STEP 4: Scale workers to desired replicas
            # ────────────────────────────────────────────────────────────────
            echo ""
            echo "📊 Step 4/4: Scaling workers to production configuration..."
            $COMPOSE_CMD -f docker-compose.prod.yml up -d --scale telegram-worker=5 \
              --scale translation-worker=2 \
              --scale emotion-worker=2 \
              --scale geolocation-worker=3 \
              --no-recreate telegram-worker translation-worker emotion-worker geolocation-worker
            
            echo ""
            echo "═══════════════════════════════════════════════════════════════"
            echo "✅ DEPLOYMENT COMPLETED"
            echo "═══════════════════════════════════════════════════════════════"
            
            # ────────────────────────────────────────────────────────────────
            # POST-DEPLOYMENT: Health Check
            # ────────────────────────────────────────────────────────────────
            echo ""
            echo "🏥 Running health checks..."
            sleep 5
            
            $COMPOSE_CMD -f docker-compose.prod.yml ps
            
            echo ""
            echo "🔍 Checking critical services..."
            for service in frontend backend job-launcher; do
              if $COMPOSE_CMD -f docker-compose.prod.yml ps "$service" 2>/dev/null | grep -q "Up"; then
                echo "  ✅ $service is healthy"
              else
                echo "  ❌ WARNING: $service may have issues"
                $COMPOSE_CMD -f docker-compose.prod.yml logs --tail=10 "$service"
              fi
            done
            
            # ════════════════════════════════════════════════════════════════
            # 🤖 AI MODEL INITIALIZATION
            # ════════════════════════════════════════════════════════════════
            echo ""
            echo "═══════════════════════════════════════════════════════════════"
            echo "🤖 AI Model Initialization"
            echo "═══════════════════════════════════════════════════════════════"
            
            # Check if models need to be initialized
            if [ ! -d "models" ] || [ -z "$(ls -A models 2>/dev/null)" ]; then
              echo "📦 AI models directory is empty - initialization needed"
              echo "⚠️  WARNING: Model downloads require ~3-4 GB of disk space"
              echo ""
              
              # Check available disk space
              AVAILABLE_SPACE=$(df -BG . | awk 'NR==2 {print $4}' | sed 's/G//')
              echo "💾 Available disk space: ${AVAILABLE_SPACE}GB"
              
              if [ "$AVAILABLE_SPACE" -lt 5 ]; then
                echo ""
                echo "❌ ERROR: Insufficient disk space for AI models!"
                echo "   Required: ~5 GB (models + buffer)"
                echo "   Available: ${AVAILABLE_SPACE}GB"
                echo ""
                echo "⚡ RECOMMENDED ACTIONS:"
                echo "   1. Clean up old Docker images: docker system prune -a"
                echo "   2. Clean up old logs: rm -rf logs/*.log"
                echo "   3. Expand VM disk space to at least 20GB"
                echo ""
                echo "🔄 AI workers will start but will fail until models are available"
              else
                echo "✅ Sufficient disk space available"
                echo ""
                echo "🚀 Starting model initialization in background..."
                
                # Create logs directory
                mkdir -p logs/model-downloads
                
                # Make script executable
                chmod +x scripts/init_models.sh 2>/dev/null || echo "⚠️  Warning: init_models.sh not found"
                
                # Start model initialization in background
                if [ -f "scripts/init_models.sh" ]; then
                  nohup ./scripts/init_models.sh docker-compose.prod.yml > logs/model-init.log 2>&1 &
                  MODEL_INIT_PID=$!
                  
                  echo "  ✅ Model initialization started (PID: $MODEL_INIT_PID)"
                  echo "  📝 Monitor progress: tail -f logs/model-init.log"
                  echo ""
                  echo "  ⏱️  Expected initialization time: 10-30 minutes"
                  echo "  💡 Workers will automatically use models once ready"
                else
                  echo "  ⚠️  Model initialization script not found"
                  echo "  📝 You may need to manually initialize models"
                fi
              fi
            else
              echo "✅ AI models already initialized"
              echo "   Models found in: $(du -sh models 2>/dev/null | cut -f1)"
            fi
            
            echo ""
            echo "═══════════════════════════════════════════════════════════════"
            echo "📊 DEPLOYMENT SUMMARY"
            echo "═══════════════════════════════════════════════════════════════"
            echo ""
            echo "🌐 Services Deployed:"
            echo "  ├─ Core Services: ✅"
            echo "  │  ├─ Frontend (Nginx + React)"
            echo "  │  ├─ Backend (FastAPI)"
            echo "  │  └─ Job Launcher"
            echo "  │"
            echo "  ├─ Databases: ✅ (Persistent)"
            echo "  │  ├─ PostgreSQL"
            echo "  │  ├─ Neo4j"
            echo "  │  ├─ Redis"
            echo "  │  └─ Keycloak"
            echo "  │"
            echo "  └─ AI Workers: ✅"
            echo "     ├─ Telegram Scrapers (5 replicas)"
            echo "     ├─ Translation Workers (2 replicas)"
            echo "     ├─ Image Analysis Worker"
            echo "     ├─ Audio Transcription Worker"
            echo "     ├─ Emotion Analysis Workers (2 replicas)"
            echo "     ├─ Classification Worker"
            echo "     ├─ Geolocation Workers (3 replicas)"
            echo "     └─ Photon Geocoding Service"
            echo ""
            echo "🔗 Service URLs:"
            echo "  • Frontend: https://$PROD_DOMAIN"
            echo "  • API Docs: https://$PROD_DOMAIN/api/docs"
            echo "  • Keycloak: https://$PROD_DOMAIN/keycloak"
            echo ""
            echo "═══════════════════════════════════════════════════════════════"