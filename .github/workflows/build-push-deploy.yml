name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/aether

jobs:
  # ============================================================
  # BUILD & PUSH ALL IMAGES
  # ============================================================
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # Core services
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            build-args: |
              VITE_API_URL=https://aethery.cloud/api
          - service: backend
            context: .
            dockerfile: ./backend/app/Dockerfile
          - service: telegram-scraper
            context: .
            dockerfile: ./telegram_scraper/Dockerfile

          # AI Worker services
          - service: translation-worker
            context: .
            dockerfile: ./workers/translation_worker/Dockerfile
          - service: image-worker
            context: .
            dockerfile: ./workers/image_worker/Dockerfile
          - service: audio-worker
            context: .
            dockerfile: ./workers/audio_worker/Dockerfile
          - service: emotion-worker
            context: .
            dockerfile: ./workers/emotion_worker/Dockerfile
          - service: classification-worker
            context: .
            dockerfile: ./workers/classification_worker/Dockerfile
          - service: geolocation-worker
            context: .
            dockerfile: ./workers/geolocation_worker/Dockerfile
          - service: photon
            context: .
            dockerfile: ./docker/photon/Dockerfile

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧩 Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: 🚀 Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: ${{ matrix.build-args }}

  # ============================================================
  # DEPLOY TO PRODUCTION VM (runs once after all builds)
  # ============================================================
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 🚀 Deploy to Production VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 15m
          script: |
            cd ~/app
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "🚀 DEPLOYMENT START"

            export REGISTRY=ghcr.io
            export GITHUB_REPOSITORY_OWNER=${{ github.repository_owner }}
            export GITHUB_USER=${{ github.actor }}
            export GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
            export PROD_DOMAIN=${{ secrets.PROD_DOMAIN }}
            export PROD_MAIL=${{ secrets.PROD_MAIL }}
            export DB_USER=${{ secrets.DB_USER }}
            export DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            export KEYCLOAK_ADMIN=${{ secrets.KEYCLOAK_ADMIN }}
            export KEYCLOAK_ADMIN_PASSWORD=${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
            export KEYCLOAK_CLIENT_SECRET=${{ secrets.KEYCLOAK_CLIENT_SECRET }}
            export KEYCLOAK_ADMIN_CLIENT_SECRET=${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
            export TG_API_ID=${{ secrets.TG_API_ID }}
            export TG_API_HASH=${{ secrets.TG_API_HASH }}
            export TG_PHONE=${{ secrets.TG_PHONE }}
            export POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            export NEO4J_URI=bolt://neo4j:7687
            export NEO4J_PASSWORD=${{ secrets.NEO4J_PASSWORD }}
            export NEO4J_USER=neo4j
            export POSTGRES_HOST=postgres
            export POSTGRES_PORT=5432
            export POSTGRES_DB=telegramdb
            export POSTGRES_USER=telegramuser
            export ENVIRONMENT=prod

            COMPOSE_CMD="docker compose"

            # ═══════════════════════════════════════════════════════════════
            # CLEAN START (optional trigger)
            # ═══════════════════════════════════════════════════════════════
            if [ "${{ github.event.head_commit.message }}" = "redeploy: clean install" ]; then
              echo "🧹 Clean install requested..."
              $COMPOSE_CMD -f docker-compose.prod.yml down
              docker volume rm app_pgdata app_keycloak_data app_tg_sessions app_redis_data 2>/dev/null || true
              echo "✅ Cleanup complete"
            fi

            # ═══════════════════════════════════════════════════════════════
            # PHASE 1: Infrastructure
            # ═══════════════════════════════════════════════════════════════
            echo "📦 Infrastructure (cached)..."
            $COMPOSE_CMD -f docker-compose.prod.yml up -d --no-build --no-recreate postgres neo4j keycloak redis
            sleep 15

            # ═══════════════════════════════════════════════════════════════
            # PHASE 2: SSL Certificate
            # ═══════════════════════════════════════════════════════════════
            echo "🔐 SSL Certificate..."
            if [ ! -f "certbot/conf/live/$PROD_DOMAIN/fullchain.pem" ]; then
              echo "  Generating certificate..."
              mkdir -p certbot/{www,conf}
              docker run -d --name nginx-acme -p 80:80 \
                -v $(pwd)/certbot/www:/usr/share/nginx/html nginx:alpine
              sleep 5
              docker run --rm --network host \
                -v $(pwd)/certbot/conf:/etc/letsencrypt \
                -v $(pwd)/certbot/www:/var/www/certbot \
                certbot/certbot certonly \
                --webroot -w /var/www/certbot \
                -d $PROD_DOMAIN \
                --email $PROD_MAIL \
                --agree-tos --non-interactive
              docker stop nginx-acme && docker rm nginx-acme || true
              echo "✅ Certificate setup complete"
            else
              echo "✅ Certificate already exists"
            fi

            # ═══════════════════════════════════════════════════════════════
            # PHASE 3: Deploy Application
            # ═══════════════════════════════════════════════════════════════
            echo "🔄 Deploying updated services..."
            $COMPOSE_CMD -f docker-compose.prod.yml up -d --no-build backend frontend \
              telegram-worker translation-worker audio-worker emotion-worker \
              image-worker classification-worker geolocation-worker photon

            # Scale workers
            echo "📊 Scaling workers..."
            $COMPOSE_CMD -f docker-compose.prod.yml up -d --no-recreate \
              --scale telegram-worker=3 \
              --scale geolocation-worker=2

            echo "✅ Deployment complete!"
            $COMPOSE_CMD -f docker-compose.prod.yml ps --format "table {{.Service}}\t{{.Status}}\t{{.Ports}}"
