name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/aether

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            build-args: |
              VITE_API_URL=https://aethery.cloud/api
          - service: backend
            context: ./backend/app
            dockerfile: ./backend/app/Dockerfile
          - service: job-launcher
            context: ./job_launcher
            dockerfile: ./job_launcher/Dockerfile
          - service: telegram-scraper
            context: ./telegram_scraper
            dockerfile: ./telegram_scraper/Dockerfile
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: ${{ matrix.build-args }}

  deploy-to-vm:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deployment files
        run: |
          # Create a deployment script
          cat > deploy.sh << 'EOF'
          #!/bin/bash
          set -e
          
          # Variables
          REGISTRY=ghcr.io
          IMAGE_PREFIX=$1
          GITHUB_TOKEN=$2
          
          # Login to GitHub Container Registry
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u $3 --password-stdin
          
          # Pull latest images
          docker compose -f docker-compose.prod.yml pull
          
          if [ ! -f "/var/lib/docker/volumes/aether_certbot_conf/_data/live/$PROD_DOMAIN/fullchain.pem" ]; then
              echo "SSL certificates not found. Running initial SSL setup..."
              
              # Start with HTTP-only configuration
              cp docker/nginx/default-http.conf docker/nginx/default.conf
              
              # Stop any running containers
              $COMPOSE_CMD -f docker-compose.prod.yml down || true
              
              # Start services
              $COMPOSE_CMD -f docker-compose.prod.yml up -d
              
              # Wait for services
              sleep 60
              
              # Generate SSL certificates
              echo "Generating SSL certificates..."
              $COMPOSE_CMD -f docker-compose.prod.yml exec -T certbot \
                  certbot certonly \
                  --webroot \
                  --webroot-path=/var/www/certbot \
                  --email $PROD_MAIL \
                  --agree-tos \
                  --no-eff-email \
                  --non-interactive \
                  -d $PROD_DOMAIN
              
              if [ $? -eq 0 ]; then
                  echo "SSL certificates generated successfully!"
                  # Switch to HTTPS configuration
                  cp docker/nginx/default-https.conf docker/nginx/default.conf
                  $COMPOSE_CMD -f docker-compose.prod.yml restart frontend
              else
                  echo "SSL certificate generation failed!"
                  exit 1
              fi
          else
              echo "SSL certificates found. Using HTTPS configuration..."
              cp docker/nginx/default-https.conf docker/nginx/default.conf
          fi
          
          # Final deployment
          $COMPOSE_CMD -f docker-compose.prod.yml down --timeout 30 || true
          $COMPOSE_CMD -f docker-compose.prod.yml up -d
          
          # Clean up old images
          docker image prune -f
          EOF
          chmod +x deploy.sh

      - name: Copy files to production VM
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "docker-compose.prod.yml,deploy.sh,docker/,keycloak/,certbot/"
          target: "~/app/"
          strip_components: 0

      - name: Deploy to Production VM with Host Certbot
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd ~/app
            
            # Set environment variables from GitHub Secrets
            export PROD_DOMAIN=${{ secrets.PROD_DOMAIN }}
            export PROD_MAIL=${{ secrets.PROD_MAIL }}
            export DB_USER=${{ secrets.DB_USER }}
            # ... alle anderen secrets
            
            # Determine Docker Compose command
            if command -v docker-compose &> /dev/null; then
              COMPOSE_CMD="docker-compose"
            else
              COMPOSE_CMD="docker compose"
            fi
            
            # Login to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull latest images
            $COMPOSE_CMD -f docker-compose.prod.yml pull
            
            # Check if SSL certificates exist on host
            if [ ! -f "/etc/letsencrypt/live/$PROD_DOMAIN/fullchain.pem" ]; then
              echo "No SSL certificates found. Setting up with host certbot..."
              
              # Update docker-compose to mount host certificates
              sed -i 's|./certbot/conf:/etc/letsencrypt:ro|/etc/letsencrypt:/etc/letsencrypt:ro|' docker-compose.prod.yml
              
              # Start containers first (with HTTP-only nginx config)
              $COMPOSE_CMD -f docker-compose.prod.yml up -d
              
              # Wait for nginx to be ready
              sleep 30
              
              # Generate SSL certificates with host certbot
              sudo certbot certonly \
                --webroot \
                --webroot-path=./certbot/www \
                --email $PROD_MAIL \
                --agree-tos \
                --no-eff-email \
                --non-interactive \
                -d $PROD_DOMAIN
              
              if [ $? -eq 0 ]; then
                echo "SSL certificates generated successfully!"
                # Restart frontend to load SSL certificates
                $COMPOSE_CMD -f docker-compose.prod.yml restart frontend
              else
                echo "SSL generation failed, continuing with HTTP"
              fi
            else
              echo "SSL certificates found. Using existing certificates..."
              # Ensure docker-compose uses host certificates
              sed -i 's|./certbot/conf:/etc/letsencrypt:ro|/etc/letsencrypt:/etc/letsencrypt:ro|' docker-compose.prod.yml
            fi
            
            # Final deployment
            $COMPOSE_CMD -f docker-compose.prod.yml up -d
            
            echo "Deployment completed!"

