name: CI

on:
  push:
    branches: [ "main" ]

jobs:
  build-push-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract metadata (tags, labels) for Frontend Docker Image
        id: meta_frontend
        uses: docker/metadata-action@v3
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/aether-frontend

      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: ./frontend 
          file: ./frontend/Dockerfile
          push: true  
          tags: ${{ secrets.DOCKER_USERNAME }}/aether-frontend:latest
          labels: ${{ steps.meta_frontend.outputs.labels }}
          no-cache: true
          build-args: |
            VITE_API_URL=https://xn--ther-uoa.tech/api

  build-push-backend:
    needs: build-push-frontend
    runs-on: ubuntu-latest  
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract metadata (tags, labels) for Frontend Docker Image
        id: meta_backend
        uses: docker/metadata-action@v3
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/aether-backend

      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: ./backend/app 
          file: ./backend/app/Dockerfile
          push: true  
          tags: ${{ secrets.DOCKER_USERNAME }}/aether-backend:latest
          labels: ${{ steps.meta_backend.outputs.labels }}
          no-cache: true

  build-push-job_launcher:
    needs: build-push-backend
    runs-on: ubuntu-latest  
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract metadata (tags, labels) for Frontend Docker Image
        id: meta_job_launcher
        uses: docker/metadata-action@v3
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/aether-job_launcher

      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: ./job_launcher 
          file: ./job_launcher/Dockerfile
          push: true  
          tags: ${{ secrets.DOCKER_USERNAME }}/aether-job_launcher:latest
          labels: ${{ steps.meta_job_launcher.outputs.labels }}
          no-cache: true

  build-push-telegram_scraper:
    needs: build-push-job_launcher
    runs-on: ubuntu-latest  
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract metadata (tags, labels) for Frontend Docker Image
        id: meta_telegram_scraper
        uses: docker/metadata-action@v3
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/aether-telegram_scraper

      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: ./telegram_scraper
          file: ./telegram_scraper/Dockerfile
          push: true  
          tags: ${{ secrets.DOCKER_USERNAME }}/aether-telegram_scraper:latest
          labels: ${{ steps.meta_telegram_scraper.outputs.labels }}
          no-cache: true

  deploy-prod:
    needs: build-push-telegram_scraper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy docker-compose.yml to prod
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/var/www/app/"

      - name: Deploy to Prod
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            export PROD_DOMAIN=${{ secrets.PROD_DOMAIN }}
            export PROD_MAIL=${{ secrets.PROD_MAIL }}
            export DB_USER=${{ secrets.DB_USER }}
            export DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            export KEYCLOAK_HOSTNAME=keycloak
            export KC_DB_USERNAME=${{ secrets.DB_USER }}
            export KC_DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            export KEYCLOAK_ADMIN=${{ secrets.KEYCLOAK_ADMIN }}
            export KEYCLOAK_ADMIN_PASSWORD=${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
            export KEYCLOAK_CLIENT_SECRET=${{ secrets.KEYCLOAK_CLIENT_SECRET }}
            export KEYCLOAK_ADMIN_CLIENT_SECRET=${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
            export TG_API_ID=${{ secrets.TG_API_ID }}
            export TG_API_HASH=${{ secrets.TG_API_HASH }}
            export TG_PHONE=${{ secrets.TG_PHONE }}
            export POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            export NEO4J_PASSWORD=${{ secrets.NEO4J_PASSWORD }}
            export JOB_SECRET_TOKEN=${{ secrets.JOB_SECRET_TOKEN }}
            cd /var/www/app
            mv /var/www/app/docker-compose.prod.yml /var/www/app/docker-compose.yml
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
            docker compose pull
            docker compose up -d
