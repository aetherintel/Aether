name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/aether

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # Core services
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            build-args: |
              VITE_API_URL=https://aethery.cloud/api
          - service: backend
            context: ./backend/app
            dockerfile: ./backend/app/Dockerfile
          - service: job-launcher
            context: ./job_launcher
            dockerfile: ./job_launcher/Dockerfile
          - service: telegram-scraper
            context: ./telegram_scraper
            dockerfile: ./telegram_scraper/Dockerfile
          
          # AI Worker services
          - service: translation-worker
            context: .
            dockerfile: ./workers/translation_worker/Dockerfile
          - service: image-worker
            context: .
            dockerfile: ./workers/image_worker/Dockerfile
          - service: audio-worker
            context: .
            dockerfile: ./workers/audio_worker/Dockerfile
          - service: emotion-worker
            context: .
            dockerfile: ./workers/emotion_worker/Dockerfile
          - service: classification-worker
            context: .
            dockerfile: ./workers/classification_worker/Dockerfile
          - service: geolocation-worker
            context: .
            dockerfile: ./workers/geolocation_worker/Dockerfile
          - service: photon
            context: .
            dockerfile: ./docker/photon/Dockerfile
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: ${{ matrix.build-args }}

  deploy-to-vm:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Copy files to production VM
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "docker-compose.prod.yml,docker/,keycloak/,certbot/"
          target: "~/app/"
          strip_components: 0

      - name: Deploy to Production VM with Host Certbot
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd ~/app

            export REGISTRY=ghcr.io
            export GITHUB_REPOSITORY_OWNER=${{ github.repository_owner }}
            export GITHUB_USER=${{ github.actor }}
            export GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
            
            # Production environment variables
            export PROD_DOMAIN=${{ secrets.PROD_DOMAIN }}
            export PROD_MAIL=${{ secrets.PROD_MAIL }}
            export DB_USER=${{ secrets.DB_USER }}
            export DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            export KEYCLOAK_ADMIN=${{ secrets.KEYCLOAK_ADMIN }}
            export KEYCLOAK_ADMIN_PASSWORD=${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
            export KEYCLOAK_CLIENT_SECRET=${{ secrets.KEYCLOAK_CLIENT_SECRET }}
            export KEYCLOAK_ADMIN_CLIENT_SECRET=${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
            export TG_API_ID=${{ secrets.TG_API_ID }}
            export TG_API_HASH=${{ secrets.TG_API_HASH }}
            export TG_PHONE=${{ secrets.TG_PHONE }}
            export POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            export NEO4J_PASSWORD=${{ secrets.NEO4J_PASSWORD }}
            export JOB_SECRET_TOKEN=${{ secrets.JOB_SECRET_TOKEN }}
            export NEO4J_USER=neo4j
            export POSTGRES_HOST=postgres
            export POSTGRES_PORT=5432
            export POSTGRES_DB=telegramdb
            export POSTGRES_USER=telegramuser
            export JOB_LAUNCHER_URL=http://job-launcher:9001
            export MEDIA_PATH=${PWD}/shared/media
            export ENVIRONMENT=prod
            
            # Determine Docker Compose command
            if command -v docker-compose &> /dev/null; then
              COMPOSE_CMD="docker-compose"
            else
              COMPOSE_CMD="docker compose"
            fi
            
            # Login to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Define stateful services (don't recreate these)
            STATEFUL_SERVICES="postgres neo4j keycloak redis"
            # Define stateless services (safe to recreate)
            STATELESS_SERVICES="frontend backend job-launcher telegram-worker translation-worker image-worker audio-worker emotion-worker classification-worker geolocation-worker photon certbot"
            
            echo "=== GRACEFUL DEPLOYMENT STARTING ==="
            
            # Pull latest images first
            echo "Pulling latest images..."
            $COMPOSE_CMD -f docker-compose.prod.yml pull $STATELESS_SERVICES
            
            # Function to handle container conflicts gracefully
            handle_container_conflicts() {
              local service_name=$1
              echo "Checking for conflicts with $service_name..."
              
              # Find all containers with this name (including stopped ones)
              CONTAINER_IDS=$(docker ps -aq --filter "name=${service_name}")
              
              if [ ! -z "$CONTAINER_IDS" ]; then
                echo "Found existing containers for $service_name, cleaning up..."
                for container_id in $CONTAINER_IDS; do
                  echo "Processing container: $container_id"
                  
                  # Disconnect from all networks first
                  NETWORKS=$(docker inspect "$container_id" --format '{{range $net, $conf := .NetworkSettings.Networks}}{{$net}} {{end}}' 2>/dev/null || echo "")
                  for network in $NETWORKS; do
                    if [ ! -z "$network" ] && [ "$network" != "<no" ]; then
                      echo "Disconnecting from network: $network"
                      docker network disconnect "$network" "$container_id" --force 2>/dev/null || true
                    fi
                  done
                  
                  # Stop and remove container
                  docker stop "$container_id" --time 5 2>/dev/null || true
                  docker rm "$container_id" --force 2>/dev/null || true
                done
              fi
              
              # Additional cleanup: remove any dangling network endpoints
              docker network ls --filter "name=aether-network" --format "{{.Name}}" | while read network; do
                if [ ! -z "$network" ]; then
                  echo "Pruning network: $network"
                  # Try to remove and recreate the network if it has issues
                  docker network inspect "$network" >/dev/null 2>&1 && {
                    # Check if network has dangling endpoints
                    ENDPOINTS=$(docker network inspect "$network" --format '{{range $id, $config := .Containers}}{{$id}} {{end}}' 2>/dev/null || echo "")
                    for endpoint in $ENDPOINTS; do
                      if [ ! -z "$endpoint" ]; then
                        # Check if container still exists
                        if ! docker ps -aq | grep -q "$endpoint"; then
                          echo "Found dangling endpoint: $endpoint"
                          docker network disconnect "$network" "$endpoint" --force 2>/dev/null || true
                        fi
                      fi
                    done
                  }
                fi
              done
            }
            
            # Handle conflicts for stateless services only
            for service in $STATELESS_SERVICES; do
              handle_container_conflicts "$service"
            done
            
            # Check if SSL certificates exist on host
            if [ ! -f "/etc/letsencrypt/live/$PROD_DOMAIN/fullchain.pem" ]; then
              echo "No SSL certificates found. Setting up with host certbot..."
              
              # Update docker-compose to mount host certificates
              sed -i 's|./certbot/conf:/etc/letsencrypt:ro|/etc/letsencrypt:/etc/letsencrypt:ro|' docker-compose.prod.yml
              
              # Start just the frontend for certificate generation
              $COMPOSE_CMD -f docker-compose.prod.yml up -d frontend
              
              # Wait for nginx to be ready
              sleep 30
              
              # Generate SSL certificates with host certbot
              sudo certbot certonly \
                --webroot \
                --webroot-path=./certbot/www \
                --email $PROD_MAIL \
                --agree-tos \
                --no-eff-email \
                --non-interactive \
                -d $PROD_DOMAIN
              
              if [ $? -eq 0 ]; then
                echo "SSL certificates generated successfully!"
              else
                echo "SSL generation failed, continuing with HTTP"
              fi
            else
              echo "SSL certificates found. Using existing certificates..."
              # Ensure docker-compose uses host certificates
              sed -i 's|./certbot/conf:/etc/letsencrypt:ro|/etc/letsencrypt:/etc/letsencrypt:ro|' docker-compose.prod.yml
            fi
            
            # Start/ensure stateful services are running (these should already exist)
            echo "Ensuring stateful services are running..."
            for service in $STATEFUL_SERVICES; do
              if ! docker ps --filter "name=$service" --filter "status=running" | grep -q "$service"; then
                echo "Starting $service..."
                $COMPOSE_CMD -f docker-compose.prod.yml up -d "$service"
              else
                echo "$service is already running, keeping it as-is"
              fi
            done
            
            # Deploy stateless services (these get updated)
            echo "Deploying updated stateless services..."
            $COMPOSE_CMD -f docker-compose.prod.yml up -d $STATELESS_SERVICES
            
            # Wait a moment for services to stabilize
            sleep 10
            
            # Health check
            echo "=== DEPLOYMENT HEALTH CHECK ==="
            $COMPOSE_CMD -f docker-compose.prod.yml ps
            
            # Check if critical services are healthy
            for service in frontend backend; do
              if $COMPOSE_CMD -f docker-compose.prod.yml ps "$service" | grep -q "Up"; then
                echo "✅ $service is running"
              else
                echo "❌ $service failed to start"
                $COMPOSE_CMD -f docker-compose.prod.yml logs --tail=20 "$service"
              fi
            done
            
            echo "=== GRACEFUL DEPLOYMENT COMPLETED ==="
            echo ""
            echo "🤖 AI Workers deployed:"
            echo "  - Translation Worker (replicas: 2)"
            echo "  - Image Analysis Worker"
            echo "  - Audio Transcription Worker (Whisper)"
            echo "  - Emotion Analysis Worker (replicas: 2)"
            echo "  - Classification Worker"
            echo "  - Geolocation Worker (replicas: 3)"
            echo "  - Photon Geocoding Service"

