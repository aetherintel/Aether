name: CI/CD Pipeline with Model Initialization

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/aether

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # Core services
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            build-args: |
              VITE_API_URL=https://aethery.cloud/api
          - service: backend
            context: ./backend/app
            dockerfile: ./backend/app/Dockerfile
          - service: telegram-scraper
            context: ./telegram_scraper
            dockerfile: ./telegram_scraper/Dockerfile
          
          # AI Worker services
          - service: translation-worker
            context: .
            dockerfile: ./workers/translation_worker/Dockerfile
          - service: image-worker
            context: .
            dockerfile: ./workers/image_worker/Dockerfile
          - service: audio-worker
            context: .
            dockerfile: ./workers/audio_worker/Dockerfile
          - service: emotion-worker
            context: .
            dockerfile: ./workers/emotion_worker/Dockerfile
          - service: classification-worker
            context: .
            dockerfile: ./workers/classification_worker/Dockerfile
          - service: geolocation-worker
            context: .
            dockerfile: ./workers/geolocation_worker/Dockerfile
          - service: photon
            context: .
            dockerfile: ./docker/photon/Dockerfile
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: ${{ matrix.build-args }}

  deploy-to-vm:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy files to production VM
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "docker-compose.prod.yml,docker/,keycloak/,certbot/,scripts/"
          target: "~/app/"
          strip_components: 0

      # ═══════════════════════════════════════════════════════════════
      # 🤖 MODEL INITIALIZATION (BEFORE DEPLOYMENT)
      # ═══════════════════════════════════════════════════════════════
      - name: Initialize AI Models (if needed)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd ~/app
            
            echo "═══════════════════════════════════════════════════════════════"
            echo "🤖 Checking AI Model Status"
            echo "═══════════════════════════════════════════════════════════════"
            
            # Check if models exist in volumes
            MODEL_EXISTS=false
            
            if docker volume ls | grep -q "app_audio_models"; then
              FILE_COUNT=$(docker run --rm -v app_audio_models:/check alpine:latest find /check -type f 2>/dev/null | wc -l)
              if [ "$FILE_COUNT" -gt 5 ]; then
                echo "✅ Models already initialized ($FILE_COUNT files)"
                MODEL_EXISTS=true
              fi
            fi
            
            if [ "$MODEL_EXISTS" = true ]; then
              echo "⏭️  Skipping model download"
              exit 0
            fi
            
            echo ""
            echo "📥 First deployment - downloading AI models..."
            echo "⚠️  ONE-TIME operation (~3-4 GB, 10-30 minutes)"
            
            AVAILABLE_SPACE=$(df -BG . | awk 'NR==2 {print $4}' | sed 's/G//')
            echo "💾 Available: ${AVAILABLE_SPACE}GB"
            
            if [ "$AVAILABLE_SPACE" -lt 5 ]; then
              echo "❌ Insufficient space!"
              exit 1
            fi
            
            chmod +x scripts/init_models.sh
            mkdir -p logs
            
            echo "🚀 Downloading models..."
            ./scripts/init_models.sh docker-compose.prod.yml 2>&1 | tee logs/model-init.log
            
            echo "✅ Models ready"

      # ═══════════════════════════════════════════════════════════════
      # 🚀 DEPLOYMENT
      # ═══════════════════════════════════════════════════════════════
      - name: Deploy to Production VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd ~/app

            export REGISTRY=ghcr.io
            export GITHUB_REPOSITORY_OWNER=${{ github.repository_owner }}
            export GITHUB_USER=${{ github.actor }}
            export GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
            export PROD_DOMAIN=${{ secrets.PROD_DOMAIN }}
            export PROD_MAIL=${{ secrets.PROD_MAIL }}
            export DB_USER=${{ secrets.DB_USER }}
            export DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            export KEYCLOAK_ADMIN=${{ secrets.KEYCLOAK_ADMIN }}
            export KEYCLOAK_ADMIN_PASSWORD=${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
            export KEYCLOAK_CLIENT_SECRET=${{ secrets.KEYCLOAK_CLIENT_SECRET }}
            export KEYCLOAK_ADMIN_CLIENT_SECRET=${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
            export TG_API_ID=${{ secrets.TG_API_ID }}
            export TG_API_HASH=${{ secrets.TG_API_HASH }}
            export TG_PHONE=${{ secrets.TG_PHONE }}
            export POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            export NEO4J_URI=${{ secrets.NEO4J_URI }}
            export NEO4J_PASSWORD=${{ secrets.NEO4J_PASSWORD }}
            export JOB_SECRET_TOKEN=${{ secrets.JOB_SECRET_TOKEN }}
            export NEO4J_USER=neo4j
            export POSTGRES_HOST=postgres
            export POSTGRES_PORT=5432
            export POSTGRES_DB=telegramdb
            export POSTGRES_USER=telegramuser
            export MEDIA_PATH=${PWD}/shared/media
            export ENVIRONMENT=prod
            
            if command -v docker-compose &> /dev/null; then
              COMPOSE_CMD="docker-compose"
            else
              COMPOSE_CMD="docker compose"
            fi
            
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "═══════════════════════════════════════════════════════════════"
            echo "🚀 GRACEFUL DEPLOYMENT"
            echo "═══════════════════════════════════════════════════════════════"
            
            STATEFUL_SERVICES="postgres neo4j keycloak redis"
            STATELESS_SERVICES="frontend backend telegram-worker translation-worker image-worker audio-worker emotion-worker classification-worker geolocation-worker photon certbot"
            
            echo ""
            echo "📦 Step 1/4: Ensuring stateful services..."
            for service in $STATEFUL_SERVICES; do
              if $COMPOSE_CMD -f docker-compose.prod.yml ps "$service" 2>/dev/null | grep -q "Up"; then
                echo "  ✅ $service running"
              else
                echo "  🔄 Starting $service..."
                $COMPOSE_CMD -f docker-compose.prod.yml up -d "$service"
              fi
            done
            
            echo "⏳ Waiting for databases..."
            sleep 10
            
            echo ""
            echo "📥 Step 2/4: Pulling images..."
            for service in $STATELESS_SERVICES; do
              $COMPOSE_CMD -f docker-compose.prod.yml pull "$service" 2>&1 | grep -v "Pulling" | head -n 1 || true
            done
            
            echo ""
            echo "🔄 Step 3/4: Deploying services..."
            for service in $STATELESS_SERVICES; do
              echo "  🔄 $service..."
              $COMPOSE_CMD -f docker-compose.prod.yml stop "$service" --timeout 30 2>/dev/null || true
              $COMPOSE_CMD -f docker-compose.prod.yml rm -f "$service" 2>/dev/null || true
              $COMPOSE_CMD -f docker-compose.prod.yml up -d "$service"
              sleep 2
            done
            
            echo ""
            echo "📊 Step 4/4: Scaling workers..."
            $COMPOSE_CMD -f docker-compose.prod.yml up -d \
              --scale telegram-worker=5 \
              --scale translation-worker=2 \
              --scale emotion-worker=2 \
              --scale geolocation-worker=3 \
              --no-recreate telegram-worker translation-worker emotion-worker geolocation-worker
            
            echo ""
            echo "✅ DEPLOYMENT COMPLETED"


      - name: Trigger SSL Setup (async)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd ~/app
            
            # Skip wenn Cert existiert
            [ -f "certbot/conf/live/${{ secrets.PROD_DOMAIN }}/fullchain.pem" ] && exit 0
            
            # Schreibe .env.prod (alle Variablen persistent)
            cat > .env.prod << ENV_EOF
            PROD_DOMAIN=${{ secrets.PROD_DOMAIN }}
            PROD_MAIL=${{ secrets.PROD_MAIL }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            KEYCLOAK_ADMIN=${{ secrets.KEYCLOAK_ADMIN }}
            KEYCLOAK_ADMIN_PASSWORD=${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
            KEYCLOAK_CLIENT_SECRET=${{ secrets.KEYCLOAK_CLIENT_SECRET }}
            KEYCLOAK_ADMIN_CLIENT_SECRET=${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
            TG_API_ID=${{ secrets.TG_API_ID }}
            TG_API_HASH=${{ secrets.TG_API_HASH }}
            TG_PHONE=${{ secrets.TG_PHONE }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            NEO4J_URI=${{ secrets.NEO4J_URI }}
            NEO4J_PASSWORD=${{ secrets.NEO4J_PASSWORD }}
            JOB_SECRET_TOKEN=${{ secrets.JOB_SECRET_TOKEN }}
            NEO4J_USER=neo4j
            POSTGRES_HOST=postgres
            POSTGRES_PORT=5432
            POSTGRES_DB=telegramdb
            POSTGRES_USER=telegramuser
            MEDIA_PATH=\${PWD}/shared/media
            ENVIRONMENT=prod
            GITHUB_USER=${{ github.actor }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
            GITHUB_REPOSITORY_OWNER=${{ github.repository_owner }}
            JOB_LAUNCHER_URL=http://job-launcher:9001
            ENV_EOF
            
            # SSL-Setup Script (lädt .env.prod)
            cat > ssl_setup.sh << 'SCRIPT_EOF'
            #!/bin/bash
            set -a
            source .env.prod
            set +a
            
            COMPOSE_CMD="docker compose"
            command -v docker-compose &> /dev/null && COMPOSE_CMD="docker-compose"
            
            echo "🔐 Starting SSL setup for $PROD_DOMAIN"
            
            $COMPOSE_CMD -f docker-compose.prod.yml run --rm \
              --entrypoint certbot \
              certbot certonly \
              --webroot -w /var/www/certbot \
              -d $PROD_DOMAIN \
              --email $PROD_MAIL \
              --agree-tos \
              --non-interactive \
              --keep-until-expiring
            
            if [ -f "certbot/conf/live/$PROD_DOMAIN/fullchain.pem" ]; then
              echo "✅ Certificate created, restarting frontend..."
              $COMPOSE_CMD -f docker-compose.prod.yml restart frontend
              echo "✅ SSL enabled"
            else
              echo "❌ Certificate generation failed"
              exit 1
            fi
            SCRIPT_EOF
            
            chmod +x ssl_setup.sh
            nohup ./ssl_setup.sh > ssl_setup.log 2>&1 &
            echo "✅ SSL setup läuft im Hintergrund (~/app/ssl_setup.log)"
# ═══════════════════════════════════════════════════════════════
      # 🏥 HEALTH CHECK & SUMMARY
      # ═══════════════════════════════════════════════════════════════
      - name: Health Check & Summary
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd ~/app
            
            export PROD_DOMAIN=${{ secrets.PROD_DOMAIN }}
            # ... alle anderen exports wie oben ...
            
            if command -v docker-compose &> /dev/null; then
              COMPOSE_CMD="docker-compose"
            else
              COMPOSE_CMD="docker compose"
            fi
            
            echo "═══════════════════════════════════════════════════════════════"
            echo "🏥 Health Check"
            echo "═══════════════════════════════════════════════════════════════"
            
            sleep 5
            $COMPOSE_CMD -f docker-compose.prod.yml ps
            
            echo ""
            echo "🔍 Critical Services:"
            for service in frontend backend telegram-worker; do
              if $COMPOSE_CMD -f docker-compose.prod.yml ps "$service" 2>/dev/null | grep -q "Up"; then
                echo "  ✅ $service"
              else
                echo "  ❌ $service"
              fi
            done
            
            echo ""
            echo "═══════════════════════════════════════════════════════════════"
            echo "📊 DEPLOYMENT SUMMARY"
            echo "═══════════════════════════════════════════════════════════════"
            echo "🌐 Services: ✅"
            echo "🔐 SSL: $([ -f certbot/conf/live/$PROD_DOMAIN/fullchain.pem ] && echo '✅ Enabled' || echo '⚠️  HTTP Only')"
            echo "🤖 Workers: 5 Telegram, 2 Translation, 2 Emotion, 3 Geolocation"
            echo ""
            echo "🔗 URLs:"
            echo "  • Frontend: https://$PROD_DOMAIN"
            echo "  • API: https://$PROD_DOMAIN/api/docs"
            echo "═══════════════════════════════════════════════════════════════"