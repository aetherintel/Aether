name: CI

on:
  push:
    branches: [ "main" ]

jobs:
  build-push-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract metadata (tags, labels) for Frontend Docker Image
        id: meta_frontend
        uses: docker/metadata-action@v3
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/monitor-frontend

      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: ./frontend 
          file: ./frontend/Dockerfile
          push: true  
          tags: ${{ secrets.DOCKER_USERNAME }}/monitor-frontend:latest
          labels: ${{ steps.meta_frontend.outputs.labels }}
          no-cache: true

  build-push-backend:
    needs: build-push-frontend
    runs-on: ubuntu-latest  
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract metadata (tags, labels) for Frontend Docker Image
        id: meta_backend
        uses: docker/metadata-action@v3
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/monitor-backend

      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: ./backend 
          file: ./backend/Dockerfile
          push: true  
          tags: ${{ secrets.DOCKER_USERNAME }}/monitor-backend:latest
          labels: ${{ steps.meta_backend.outputs.labels }}
          no-cache: true

  deploy-prod:
    needs: build-push-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy docker-compose.yml to prod
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/var/www/app/"

      - name: Deploy to Prod
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /var/www/app
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            docker compose pull
            docker compose up -d