name: Build & Push Models

on:
  workflow_dispatch:
  push:
    paths:
      - 'models/**'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/aether

jobs:
  # ============================================================
  # BUILD & PUSH MODEL CONTAINERS
  # ============================================================
  build-and-push-models:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # Model Data Containers
          - service: llm-models
            context: ./models
            dockerfile: models/llm/Dockerfile
          - service: translation-models
            context: ./models
            dockerfile: models/translation/Dockerfile
          - service: audio-models
            context: ./models
            dockerfile: models/audio/Dockerfile
          - service: emotion-models
            context: ./models
            dockerfile: models/emotion/Dockerfile
          - service: classification-models
            context: ./models
            dockerfile: models/classifier/Dockerfile
          - service: image-models
            context: ./models
            dockerfile: models/image/Dockerfile
          - service: geolocation-models
            context: ./models
            dockerfile: models/geolocation/Dockerfile

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧩 Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: 🚀 Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # DEPLOY TO PRODUCTION VM
  # ============================================================
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push-models
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4
      
      - name: 📤 Upload compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          port: ${{ secrets.PROD_PORT }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/app/"
          overwrite: true
      - name: 🚀 Deploy to Production VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          port: ${{ secrets.PROD_PORT }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 60m
          script: |
            cd ~/app
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "🚀 MODEL DEPLOYMENT START"
            
            # Since models changed, we usually just need to pull and up.
            # The regular prod-deploy script is fine, but maybe overkill?
            # Let's keep it simple: just pull and update.
            
            export COMPOSE_CMD="docker compose"
            
            # Pull everything (including new models)
            echo "📦 Pulling latest images..."
            $COMPOSE_CMD -f docker-compose.prod.yml pull

            # Recreate services
            echo "🔄 Updating services..."
            $COMPOSE_CMD -f docker-compose.prod.yml up -d --force-recreate
            
            # Prune
            echo "🧹 Cleaning up..."
            docker image prune -af
