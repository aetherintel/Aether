name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/aether

jobs:
  # ============================================================
  # CORE SERVICES — always build (frontend + backend change often)
  # ============================================================
  build-core:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            build-args: |
              VITE_API_URL=https://aethery.cloud/api
          - service: backend
            context: .
            dockerfile: ./backend/app/Dockerfile

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧩 Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: 🚀 Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ${{ matrix.build-args }}
            VITE_ESRI_API_KEY=${{ secrets.ESRI_API_KEY }}
          secrets: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # WORKER SERVICES — only build when worker files change
  # translation-worker, emotion-worker, classification-worker,
  # llm-service run on Modal.com and are NOT built here.
  # ============================================================
  check-worker-changes:
    runs-on: ubuntu-latest
    outputs:
      workers_changed: ${{ steps.filter.outputs.workers }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workers:
              - 'workers/**'
              - 'docker/**'
              - 'telegram_scraper/**'
              - 'aether_lib/**'

  build-workers:
    needs: check-worker-changes
    if: needs.check-worker-changes.outputs.workers_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: telegram-scraper
            context: .
            dockerfile: ./telegram_scraper/Dockerfile
          - service: report-worker
            context: .
            dockerfile: ./workers/report_worker/Dockerfile
          - service: audio-worker
            context: .
            dockerfile: ./workers/audio_worker/Dockerfile
          - service: image-worker
            context: .
            dockerfile: ./workers/image_worker/Dockerfile
          - service: geolocation-worker
            context: .
            dockerfile: ./workers/geolocation_worker/Dockerfile

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧩 Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: 🚀 Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # DEPLOY — runs after core build; workers job may be skipped
  # ============================================================
  deploy:
    runs-on: ubuntu-latest
    needs: [build-core, check-worker-changes, build-workers]
    # Run if core succeeded AND (workers succeeded OR workers was skipped)
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.build-core.result == 'success' &&
      (needs.build-workers.result == 'success' || needs.build-workers.result == 'skipped')
    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🔑 Decode SSH key
        env:
          SSH_KEY_B64: ${{ secrets.PROD_SSH_KEY }}
        run: |
          printf '%s' "$SSH_KEY_B64" | base64 -d > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          head -1 /tmp/deploy_key

      - name: � Fix permissions on VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          port: ${{ secrets.PROD_PORT }}
          username: ${{ secrets.PROD_USER }}
          key_path: /tmp/deploy_key
          script: |
            mkdir -p ~/app/keycloak/exports
            sudo chown -R $USER:$USER ~/app/keycloak || true

      - name: �📤 Upload compose and configs
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          port: ${{ secrets.PROD_PORT }}
          username: ${{ secrets.PROD_USER }}
          key_path: /tmp/deploy_key
          source: "docker-compose.prod.yml,keycloak/exports/"
          target: "~/app/"
          overwrite: true

      - name: 🚀 Deploy to Production VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          port: ${{ secrets.PROD_PORT }}
          username: ${{ secrets.PROD_USER }}
          key_path: /tmp/deploy_key
          command_timeout: 60m
          script: |
            cd ~/app
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "🚀 DEPLOYMENT START"

            # ENV vars
            export REGISTRY=ghcr.io
            export GITHUB_REPOSITORY_OWNER="${{ github.repository_owner }}"
            export PROD_DOMAIN="${{ secrets.PROD_DOMAIN }}"
            export PROD_MAIL="${{ secrets.PROD_MAIL }}"
            export DB_USER="${{ secrets.DB_USER }}"
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            export KEYCLOAK_ADMIN="${{ secrets.KEYCLOAK_ADMIN }}"
            export KEYCLOAK_ADMIN_PASSWORD="${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}"
            export KEYCLOAK_CLIENT_SECRET="${{ secrets.KEYCLOAK_CLIENT_SECRET }}"
            export KEYCLOAK_ADMIN_CLIENT_SECRET="${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}"
            export TG_API_ID="${{ secrets.TG_API_ID }}"
            export TG_API_HASH="${{ secrets.TG_API_HASH }}"
            export TG_PHONE="${{ secrets.TG_PHONE }}"
            export POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"
            export NEO4J_URI=bolt://neo4j:7687
            export NEO4J_PASSWORD="${{ secrets.NEO4J_PASSWORD }}"
            export NEO4J_USER=neo4j
            export POSTGRES_HOST=postgres
            export POSTGRES_PORT=5432
            export POSTGRES_DB=telegramdb
            export POSTGRES_USER=telegramuser
            export ENVIRONMENT=prod
            export KEYCLOAK_BASE_URL=http://keycloak:8080/keycloak
            export KEYCLOAK_INTERNAL_URL=http://keycloak:8080/keycloak/realms/Aether
            export KEYCLOAK_URL="https://${PROD_DOMAIN}/keycloak/realms/Aether"
            export KEYCLOAK_HOSTNAME=keycloak
            export KEYCLOAK_CLIENT_ID=Aether
            export KEYCLOAK_ADMIN_CLIENT_ID=backend-admin-client
            export SWAGGER_TOKEN_URL="https://${PROD_DOMAIN}/keycloak/realms/Aether/protocol/openid-connect/token"
            export FRONTEND_URL="https://${PROD_DOMAIN}/"
            export MEDIA_PATH=/shared/media
            export USE_MODAL=true
            export MODAL_LLM_URL="${{ secrets.MODAL_LLM_URL }}"
            export MODAL_TRANSLATION_URL="${{ secrets.MODAL_TRANSLATION_URL }}"
            export MODAL_EMOTION_URL="${{ secrets.MODAL_EMOTION_URL }}"
            export MODAL_CLASSIFICATION_URL="${{ secrets.MODAL_CLASSIFICATION_URL }}"
            export MODAL_TOKEN_ID="${{ secrets.MODAL_TOKEN_ID }}"
            export MODAL_TOKEN_SECRET="${{ secrets.MODAL_TOKEN_SECRET }}"
            export SMTP_USER="${{ secrets.SMTP_USER }}"
            export SMTP_PASSWORD="${{ secrets.SMTP_PASSWORD }}"
            export GITHUB_USER="${{ github.actor }}"
            export GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
            export ESRI_API_KEY="${{ secrets.ESRI_API_KEY }}"

            COMPOSE_CMD="docker compose"

            # ═══════════════════════════════════════════════════════════════
            # PHASE 0a: Write .env file so vars persist for manual restarts
            # ═══════════════════════════════════════════════════════════════
            # Use printf with %s to safely write values that may contain
            # special shell characters ($, (, ), !, etc.) without interpretation
            {
              printf 'REGISTRY=%s\n'                     "ghcr.io"
              printf 'GITHUB_REPOSITORY_OWNER=%s\n'     "${GITHUB_REPOSITORY_OWNER}"
              printf 'PROD_DOMAIN=%s\n'                 "${PROD_DOMAIN}"
              printf 'PROD_MAIL=%s\n'                   "${PROD_MAIL}"
              printf 'DB_USER=%s\n'                     "${DB_USER}"
              printf 'DB_PASSWORD=%s\n'                 "${DB_PASSWORD}"
              printf 'KEYCLOAK_ADMIN=%s\n'              "${KEYCLOAK_ADMIN}"
              printf 'KEYCLOAK_ADMIN_PASSWORD=%s\n'     "${KEYCLOAK_ADMIN_PASSWORD}"
              printf 'KEYCLOAK_CLIENT_SECRET=%s\n'      "${KEYCLOAK_CLIENT_SECRET}"
              printf 'KEYCLOAK_ADMIN_CLIENT_SECRET=%s\n' "${KEYCLOAK_ADMIN_CLIENT_SECRET}"
              printf 'TG_API_ID=%s\n'                   "${TG_API_ID}"
              printf 'TG_API_HASH=%s\n'                 "${TG_API_HASH}"
              printf 'TG_PHONE=%s\n'                    "${TG_PHONE}"
              printf 'POSTGRES_PASSWORD=%s\n'           "${POSTGRES_PASSWORD}"
              printf 'NEO4J_URI=%s\n'                   "${NEO4J_URI}"
              printf 'NEO4J_PASSWORD=%s\n'              "${NEO4J_PASSWORD}"
              printf 'NEO4J_USER=%s\n'                  "${NEO4J_USER}"
              printf 'POSTGRES_HOST=%s\n'               "${POSTGRES_HOST}"
              printf 'POSTGRES_PORT=%s\n'               "${POSTGRES_PORT}"
              printf 'POSTGRES_DB=%s\n'                 "${POSTGRES_DB}"
              printf 'POSTGRES_USER=%s\n'               "${POSTGRES_USER}"
              printf 'ENVIRONMENT=%s\n'                 "${ENVIRONMENT}"
              printf 'KEYCLOAK_BASE_URL=%s\n'           "${KEYCLOAK_BASE_URL}"
              printf 'KEYCLOAK_INTERNAL_URL=%s\n'       "${KEYCLOAK_INTERNAL_URL}"
              printf 'KEYCLOAK_URL=%s\n'                "${KEYCLOAK_URL}"
              printf 'KEYCLOAK_HOSTNAME=%s\n'           "${KEYCLOAK_HOSTNAME}"
              printf 'KEYCLOAK_CLIENT_ID=%s\n'          "${KEYCLOAK_CLIENT_ID}"
              printf 'KEYCLOAK_ADMIN_CLIENT_ID=%s\n'    "${KEYCLOAK_ADMIN_CLIENT_ID}"
              printf 'SWAGGER_TOKEN_URL=%s\n'           "${SWAGGER_TOKEN_URL}"
              printf 'FRONTEND_URL=%s\n'                "${FRONTEND_URL}"
              printf 'MEDIA_PATH=%s\n'                  "${MEDIA_PATH}"
              printf 'USE_MODAL=%s\n'                   "${USE_MODAL}"
              printf 'MODAL_LLM_URL=%s\n'               "${MODAL_LLM_URL}"
              printf 'MODAL_TRANSLATION_URL=%s\n'       "${MODAL_TRANSLATION_URL}"
              printf 'MODAL_EMOTION_URL=%s\n'           "${MODAL_EMOTION_URL}"
              printf 'MODAL_CLASSIFICATION_URL=%s\n'    "${MODAL_CLASSIFICATION_URL}"
              printf 'MODAL_TOKEN_ID=%s\n'              "${MODAL_TOKEN_ID}"
              printf 'MODAL_TOKEN_SECRET=%s\n'          "${MODAL_TOKEN_SECRET}"
              printf 'SMTP_USER=%s\n'                   "${SMTP_USER}"
              printf 'SMTP_PASSWORD=%s\n'               "${SMTP_PASSWORD}"
              printf 'GITHUB_USER=%s\n'                 "${GITHUB_USER}"
              printf 'GITHUB_TOKEN=%s\n'                "${GITHUB_TOKEN}"
              printf 'ESRI_API_KEY=%s\n'                "${ESRI_API_KEY}"
            } > ~/app/.env
            chmod 600 ~/app/.env
            echo "✅ .env file written"

            # ═══════════════════════════════════════════════════════════════
            # PHASE 0b: Update compose file
            # ═══════════════════════════════════════════════════════════════
            echo "📄 Updating docker-compose.prod.yml..."
            cp docker-compose.prod.yml docker-compose.prod.yml.backup 2>/dev/null || true
            curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H 'Accept: application/vnd.github.v3.raw' \
              -o docker-compose.prod.yml \
              -L https://api.github.com/repos/${{ github.repository }}/contents/docker-compose.prod.yml
            echo "✅ Compose file updated"
            echo "🔍 Checking new compose file:"
            grep "KEYCLOAK_BASE_URL:" docker-compose.prod.yml | head -1

            # ═══════════════════════════════════════════════════════════════
            # PHASE 1: Pull Latest Images (APP SERVICES ONLY)
            # ═══════════════════════════════════════════════════════════════
            echo "📦 Pulling latest images..."
            $COMPOSE_CMD -f docker-compose.prod.yml pull \
              backend frontend \
              telegram-worker report-worker \
              image-worker audio-worker \
              geolocation-worker \
              mcp-neo4j-cypher-server

            # ═══════════════════════════════════════════════════════════════
            # PHASE 2: Infrastructure (keep running)
            # ═══════════════════════════════════════════════════════════════
            echo "🗄️ Ensuring infrastructure is running..."
            $COMPOSE_CMD -f docker-compose.prod.yml up -d --no-recreate postgres neo4j redis

            echo "⏳ Waiting for Postgres..."
            sleep 10

            echo "🗄️ checking/creating databases..."
            docker exec -i postgres createdb -U $DB_USER keycloak 2>/dev/null || true
            docker exec -i postgres createdb -U $DB_USER telegramdb 2>/dev/null || true
            docker exec -i postgres createdb -U $DB_USER aether 2>/dev/null || true

            # ═══════════════════════════════════════════════════════════════
            # PHASE 3: Keycloak (force rebuild to import realm)
            # ═══════════════════════════════════════════════════════════════
            echo "🔐 Rebuilding Keycloak..."
            docker rm -f $(docker ps -aq --filter "name=keycloak") 2>/dev/null || true
            docker network disconnect -f app_aether-network keycloak 2>/dev/null || true

            $COMPOSE_CMD -f docker-compose.prod.yml up -d keycloak --force-recreate
            echo "⏳ Waiting for Keycloak to initialize..."
            sleep 30

            # ═══════════════════════════════════════════════════════════════
            # PHASE 4: SSL Certificate
            # ═══════════════════════════════════════════════════════════════
            echo "🔐 Checking SSL Certificate..."
            if [ ! -f "certbot/conf/live/$PROD_DOMAIN/fullchain.pem" ]; then
              echo "  Generating certificate..."
              mkdir -p certbot/{www,conf}
              docker run -d --name nginx-acme -p 80:80 \
                -v $(pwd)/certbot/www:/usr/share/nginx/html nginx:alpine
              sleep 5

              if docker run --rm --network host \
                -v $(pwd)/certbot/conf:/etc/letsencrypt \
                -v $(pwd)/certbot/www:/var/www/certbot \
                certbot/certbot certonly \
                --webroot -w /var/www/certbot \
                -d $PROD_DOMAIN \
                --email $PROD_MAIL \
                --agree-tos --non-interactive; then
                  echo "✅ Certbot success!"
              else
                  echo "⚠️ Certbot failed (DNS not ready?). Generating SELF-SIGNED fallback..."
                  mkdir -p certbot/conf/live/$PROD_DOMAIN
                  openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                    -keyout certbot/conf/live/$PROD_DOMAIN/privkey.pem \
                    -out certbot/conf/live/$PROD_DOMAIN/fullchain.pem \
                    -subj "/CN=$PROD_DOMAIN"
                  echo "✅ Self-signed cert created."
              fi

              docker stop nginx-acme && docker rm nginx-acme || true
            fi

            # ═══════════════════════════════════════════════════════════════
            # PHASE 5: Application Services
            # ═══════════════════════════════════════════════════════════════
            echo "🔄 Deploying application services..."
            docker rm -f $(docker ps -aq --filter "name=backend") 2>/dev/null || true
            docker rm -f $(docker ps -aq --filter "name=frontend") 2>/dev/null || true
            docker network disconnect -f app_aether-network backend 2>/dev/null || true
            docker network disconnect -f app_aether-network frontend 2>/dev/null || true

            $COMPOSE_CMD -f docker-compose.prod.yml pull backend frontend
            $COMPOSE_CMD -f docker-compose.prod.yml up -d --force-recreate backend frontend

            echo "⏳ Waiting for services..."
            for i in {1..30}; do
              if docker exec backend printenv KEYCLOAK_BASE_URL >/dev/null 2>&1; then
                break
              fi
              echo -n "."
              sleep 2
            done
            echo ""

            echo "🔍 Verifying backend configuration..."
            KEYCLOAK_BASE=$(docker exec backend printenv KEYCLOAK_BASE_URL 2>/dev/null || echo "ERROR")

            if [[ "$KEYCLOAK_BASE" == "ERROR" ]]; then
              echo "❌ Backend not running!"
              docker logs backend --tail 50
              exit 1
            fi

            if [[ "$KEYCLOAK_BASE" != "http://keycloak:8080/keycloak" ]]; then
              echo "❌ Wrong KEYCLOAK_BASE_URL: $KEYCLOAK_BASE"
              exit 1
            fi

            echo "✅ Backend configured correctly"

            # ═══════════════════════════════════════════════════════════════
            # PHASE 6: Workers
            # --no-recreate: start if not running, leave alone if already up.
            # Workers are only force-recreated when their images were rebuilt
            # (i.e. when build-workers ran). translation/emotion/classification
            # run on Modal.com and are NOT started here.
            # ═══════════════════════════════════════════════════════════════
            echo "👷 Ensuring workers are running..."
            if [ "${{ needs.build-workers.result }}" = "success" ]; then
              echo "  Workers were rebuilt — force-recreating..."
              docker stop $(docker ps -q --filter "name=worker") 2>/dev/null || true
              docker rm $(docker ps -aq --filter "name=worker") 2>/dev/null || true
              $COMPOSE_CMD -f docker-compose.prod.yml up -d \
                --scale telegram-worker=3 \
                --scale geolocation-worker=2 \
                --force-recreate --no-build \
                telegram-worker audio-worker \
                image-worker geolocation-worker report-worker
            else
              echo "  Workers unchanged — starting any that are not yet running..."
              $COMPOSE_CMD -f docker-compose.prod.yml up -d \
                --scale telegram-worker=3 \
                --scale geolocation-worker=2 \
                --no-recreate --no-build \
                telegram-worker audio-worker \
                image-worker geolocation-worker report-worker
            fi

            echo "🔌 Ensuring MCP server is running..."
            $COMPOSE_CMD -f docker-compose.prod.yml up -d --no-recreate mcp-neo4j-cypher-server

            # ═══════════════════════════════════════════════════════════════
            # PHASE 7: Cleanup
            # ═══════════════════════════════════════════════════════════════
            echo "🧹 Cleaning up old images..."
            docker image prune -af

            echo "✅ Deployment complete!"
            $COMPOSE_CMD -f docker-compose.prod.yml ps
